                { id: '2-4', q: "1 小時 15 分鐘等於幾分鐘？", options: ["75分鐘", "115分鐘", "65分鐘", "85分鐘"], ans: "75分鐘", hint: "1小時是60分鐘，60 + 15 = ?" },

                { id: '2-9', q: "3 分鐘等於幾秒鐘？", options: ["180秒鐘", "120秒鐘", "90秒鐘", "300秒鐘"], ans: "180秒鐘", hint: "1分鐘=60秒，60 × 3 = ?" },
                { id: '2-10', q: "4 分鐘 10 秒鐘等於幾秒鐘？", options: ["250秒鐘", "410秒鐘", "240秒鐘", "260秒鐘"], ans: "250秒鐘", hint: "先算 60×4=240，然後 240+10。" },

                { id: '2-14', q: "5 分鐘等於幾秒鐘？", options: ["300秒鐘", "250秒鐘", "350秒鐘", "200秒鐘"], ans: "300秒鐘", hint: "1分鐘=60秒，5分鐘是 60 × 5 = 300 秒鐘。" },
                { id: '2-15', q: "300 秒鐘等於幾分鐘？", options: ["5分鐘", "4分鐘", "6分鐘", "30分鐘"], ans: "5分鐘", hint: "60秒=1分鐘，300裡面有 5 個 60 (60 × 5 = 300)。" },
                { id: '2-16', q: "80 分鐘可以換成幾小時幾分鐘？", options: ["1小時20分鐘", "1小時10分鐘", "1小時30分鐘", "2小時"], ans: "1小時20分鐘", hint: "80分鐘減去60分鐘(1小時)，還剩下 20 分鐘。" },
                { id: '2-17', q: "3 小時等於幾分鐘？", options: ["180分鐘", "120分鐘", "150分鐘", "210分鐘"], ans: "180分鐘", hint: "1小時=60分，3小時是 60 × 3 = 180 分鐘。" },
                { id: '2-18', q: "130 秒鐘可以換成幾分鐘幾秒鐘？", options: ["2分鐘10秒鐘", "2分鐘20秒鐘", "1分鐘30秒鐘", "2分鐘"], ans: "2分鐘10秒鐘", hint: "120秒是2分鐘，130 - 120 = 10，所以是 2 分鐘 10 秒鐘。" }
            ],
            level3: [
                { id: '3-1', q: "3時 25分 + 1時 6分 = ?", options: ["4時 31分", "4時 25分", "3時 31分", "4時 30分"], ans: "4時 31分", hint: "時加時(3+1)，分加分(25+6)。" },
                { id: '3-2', q: "3時 40分 - 2時 15分 = ?", options: ["1時 25分", "1時 15分", "2時 25分", "5時 55分"], ans: "1時 25分", hint: "時減時(3-2)，分減分(40-15)。" },
                { id: '3-3', q: "2時 10分 + 1時 40分 = ?", options: ["3時 50分", "3時 40分", "2時 50分", "4時"], ans: "3時 50分", hint: "時加時(2+1)，分加分(10+40)。" },
                { id: '3-4', q: "4時 50分 - 1時 20分 = ?", options: ["3時 30分", "3時 20分", "2時 30分", "5時 30分"], ans: "3時 30分", hint: "時減時(4-1)，分減分(50-20)。" },
                { id: '3-5', q: "1時 45分 + 30分 = ?", options: ["2時 15分", "1時 75分", "2時 5分", "2時 25分"], ans: "2時 15分", hint: "45+30=75分，75分要換成1小時又15分喔！" },
                { id: '3-6', q: "2時 30分 - 40分 = ?", options: ["1時 50分", "2時 10分", "1時 40分", "2時 50分"], ans: "1時 50分", hint: "30分不夠減40分，要跟2時借1小時(60分)來減。 (60+30)-40=?" },
                { id: '3-7', q: "5時 15分 + 2時 20分 = ?", options: ["7時 35分", "7時 45分", "6時 35分", "8時"], ans: "7時 35分", hint: "時加時(5+2)，分加分(15+20)。" },
                { id: '3-8', q: "6時 55分 - 3時 15分 = ?", options: ["3時 40分", "3時 30分", "2時 40分", "4時 40分"], ans: "3時 40分", hint: "時減時(6-3)，分減分(55-15)。" },
                { id: '3-9', q: "2時 50分 + 1時 20分 = ?", options: ["4時 10分", "3時 70分", "4時 20分", "3時 10分"], ans: "4時 10分", hint: "50+20=70分，70分滿60了，要進位成1小時又10分喔！" },
                { id: '3-10', q: "4時 10分 - 1時 30分 = ?", options: ["2時 40分", "3時 40分", "2時 20分", "3時 20分"], ans: "2時 40分", hint: "10分不夠減30分，跟4時借1小時(60分)。 (60+10)-30=?" },
                { id: '3-11', q: "1時 20分 + 2時 40分 = ?", options: ["4時 0分", "3時 60分", "4時 10分", "3時 40分"], ans: "4時 0分", hint: "20+40=60分，剛好進位變成1小時，所以是 1+2+1 = 4時。" },
                { id: '3-12', q: "5時 0分 - 2時 25分 = ?", options: ["2時 35分", "3時 35分", "2時 25分", "3時 25分"], ans: "2時 35分", hint: "0分不夠減25分，跟5時借1小時(60分)。 60 - 25 = ?" },
                { id: '3-13', q: "1時 35分 + 2時 15分 = ?", options: ["3時 50分", "3時 40分", "4時 50分", "4時"], ans: "3時 50分", hint: "時加時(1+2)，分加分(35+15)。" },
                { id: '3-14', q: "5時 20分 - 3時 15分 = ?", options: ["2時 5分", "2時 15分", "1時 5分", "2時 10分"], ans: "2時 5分", hint: "時減時(5-3)，分減分(20-15)。" },
                { id: '3-15', q: "2時 40分 + 50分 = ?", options: ["3時 30分", "2時 90分", "3時 10分", "3時 20分"], ans: "3時 30分", hint: "40 + 50 = 90分，90分進位成 1 小時 30 分，所以是 3 時 30 分。" },
                { id: '3-16', q: "3時 15分 - 45分 = ?", options: ["2時 30分", "2時 45分", "2時 20分", "3時 30分"], ans: "2時 30分", hint: "15分不夠減45分，借 1 小時(60分)。(60+15)-45 = 30 分。" },
                { id: '3-17', q: "4時 45分 + 1時 15分 = ?", options: ["6時 0分", "5時 60分", "5時 0分", "6時 15分"], ans: "6時 0分", hint: "45 + 15 = 60分，滿60分進位成 1 小時，4+1+1 = 6 時。" },
                { id: '3-18', q: "6時 10分 - 2時 40分 = ?", options: ["3時 30分", "4時 30分", "3時 40分", "4時"], ans: "3時 30分", hint: "10分不夠減40分，借 1 小時(60分)。(60+10)-40 = 30 分，5 - 2 = 3 時。" }
            ]
        };

        // --- SVG Icons ---
        const Icons = {
            Wand: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8l1.4 1.4"/><path d="M17.8 6.2l1.4-1.4"/><path d="M12.2 6.2l-1.4-1.4"/><path d="M12.2 11.8l-1.4 1.4"/><path d="M2.5 21.5l14-14"/></svg>,
            Hourglass: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>,
            Book: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>,
            Star: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        };

        // === Firebase 配置 ===
        const firebaseConfig = {
            apiKey: "AIzaSyC48oAqalT77SPpYVtCupYfV5hd6_ZrD2I",
            authDomain: "my-teaching-tools-01.firebaseapp.com",
            projectId: "my-teaching-tools-01",
            storageBucket: "my-teaching-tools-01.firebasestorage.app",
            messagingSenderId: "552535919921",
            appId: "1:552535919921:web:95b4c1288edbae9572b410"
        };
        
        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch (err) {
            console.error("Firebase init error:", err);
        }

        const App = () => {
            const [gameState, setGameState] = useState('start'); // start, playing, end
            const [currentLevel, setCurrentLevel] = useState(1);
            const [score, setScore] = useState(0);
            
            // 遊戲進度狀態
            const [questions, setQuestions] = useState([]);
            const [qIndex, setQIndex] = useState(0);
            
            // 防瞎猜機制狀態
            const [mistakes, setMistakes] = useState(0);
            const [disabledOptions, setDisabledOptions] = useState([]);
            const [showHint, setShowHint] = useState(false);
            
            // 防連點鎖定
            const isProcessingRef = useRef(false);

            // 學生登入資料
            const [studentClass, setStudentClass] = useState(localStorage.getItem('student_class') || '');
            const [studentSeat, setStudentSeat] = useState(localStorage.getItem('student_seat') || '');
            const [showLoginModal, setShowLoginModal] = useState(false);

            // 排行榜資料
            const [leaderboard, setLeaderboard] = useState([]);
            const [loadingLeaderboard, setLoadingLeaderboard] = useState(false);

            // 確保有班級座號
            useEffect(() => {
                const storedClass = localStorage.getItem('student_class');
                const storedSeat = localStorage.getItem('student_seat');
                if (!storedClass || !storedSeat) {
                    setShowLoginModal(true);
                }
            }, []);
            
            // 題庫記憶區 (直到抽完才洗牌)
            const poolsRef = useRef({
                level1: [],
                level2: [],
                level3: []
            });

            const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);

            const startLevel = (levelNum) => {
                const levelKey = `level${levelNum}`;
                
                // 學生隔離的 localStorage key
                const sClass = localStorage.getItem('student_class') || '';
                const sSeat = localStorage.getItem('student_seat') || '';
                const storageKey = `answered_math_questions_8_${sClass}_${sSeat}`;
                const answeredQuestions = JSON.parse(localStorage.getItem(storageKey) || '[]');
                
                // 過濾掉該關卡中已經答對過的題目 (題目的唯一識別是 q，即問題文字)
                let eligiblePool = ALL_QUESTIONS[levelKey].filter(item => !answeredQuestions.includes(item.q));
                
                // 如果該關卡剩餘未做對的題目不足 4 題，則清除該關卡在此儲存庫中的答對歷史紀錄，以防學生無題可做
                if (eligiblePool.length < 4) {
                    const poolTexts = ALL_QUESTIONS[levelKey].map(item => item.q);
                    const updatedAnswers = answeredQuestions.filter(qText => !poolTexts.includes(qText));
                    localStorage.setItem(storageKey, JSON.stringify(updatedAnswers));
                    eligiblePool = ALL_QUESTIONS[levelKey];
                }
                
                // 洗牌並抽出 4 題
                const selectedQs = shuffleArray(eligiblePool).slice(0, 4);
                
                // 將這 4 題的選項也洗牌
                const formattedQs = selectedQs.map(q => ({
                    ...q,
                    options: shuffleArray(q.options)
                }));

                setCurrentLevel(levelNum);
                setQuestions(formattedQs);
                setQIndex(0);
                setMistakes(0);
                setDisabledOptions([]);
                setShowHint(false);
                setGameState('playing');
                isProcessingRef.current = false;
            };

            const startGame = () => {
                if (!studentClass || !studentSeat) {
                    setShowLoginModal(true);
                    return;
                }
                setScore(0);
                startLevel(1);
            };

            const handleAnswer = (opt) => {
                if (isProcessingRef.current) return;
                
                const currentQ = questions[qIndex];
                
                if (opt === currentQ.ans) {
                    // 答對了
                    isProcessingRef.current = true;
                    
                    // 計算分數: 0錯=20分, 1錯=10分, 2錯=5分, 3錯=0分
                    let pts = 20;
                    if (mistakes === 1) pts = 10;
                    if (mistakes === 2) pts = 5;
                    if (mistakes >= 3) pts = 0;
                    
                    const newScore = score + pts;
                    setScore(newScore);

                    // 記憶已答對的題目，進行學生隔離
                    const sClass = localStorage.getItem('student_class') || '';
                    const sSeat = localStorage.getItem('student_seat') || '';
                    const storageKey = `answered_math_questions_8_${sClass}_${sSeat}`;
                    const answered = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    if (currentQ.q && !answered.includes(currentQ.q)) {
                        answered.push(currentQ.q);
                        localStorage.setItem(storageKey, JSON.stringify(answered));
                    }
                    
                    // 視覺回饋 (答對按鈕變綠色) - 透過鎖定所有非正確選項並標示正確選項達成
                    setDisabledOptions(currentQ.options.filter(o => o !== currentQ.ans));

                    setTimeout(() => {
                        if (qIndex < 3) {
                            // 下一題
                            setQIndex(prev => prev + 1);
                            setMistakes(0);
                            setDisabledOptions([]);
                            setShowHint(false);
                            isProcessingRef.current = false;
                        } else {
                            // 關卡結束，判斷是否進入下一關
                            if (currentLevel < 3) {
                                startLevel(currentLevel + 1);
                            } else {
                                setGameState('end');
                                submitScoreAndFetchLeaderboard(newScore);
                            }
                        }
                    }, 1500);

                } else {
                    // 答錯了
                    setMistakes(prev => prev + 1);
                    setDisabledOptions(prev => [...prev, opt]);
                    setShowHint(true); // 第一次答錯強制顯示提示
                }
            };

            // 提交成績並拉取排行榜
            const submitScoreAndFetchLeaderboard = async (finalScore) => {
                if (!db) return;
                setLoadingLeaderboard(true);
                const payload = {
                    class: studentClass.trim(),
                    seat: studentSeat.trim(),
                    score: finalScore,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };
                try {
                    await db.collection("math_game_scores_8").add(payload);
                    const snapshot = await db.collection("math_game_scores_8")
                        .orderBy("score", "desc")
                        .limit(50)
                        .get();
                    const list = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        list.push({
                            class: data.class,
                            seat: data.seat,
                            score: data.score,
                            timestamp: data.timestamp ? data.timestamp.toDate() : new Date()
                        });
                    });
                    list.sort((a, b) => {
                        if (b.score !== a.score) {
                            return b.score - a.score;
                        }
                        return a.timestamp - b.timestamp;
                    });
                    setLeaderboard(list.slice(0, 20));
                } catch (err) {
                    console.error("Firebase submit/query failed:", err);
                } finally {
                    setLoadingLeaderboard(false);
                }
            };

            const handleSaveLogin = (e) => {
                e.preventDefault();
                if (studentClass.trim() && studentSeat.trim()) {
                    localStorage.setItem('student_class', studentClass.trim());
                    localStorage.setItem('student_seat', studentSeat.trim());
                    setShowLoginModal(false);
                }
            };

            if (gameState === 'start') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-purple-900 to-black">
                        <div className="glass-panel p-10 max-w-lg w-full text-center fade-in space-y-6">
                            <div className="flex justify-center text-yellow-400">
                                <Icons.Wand />
                            </div>
                            <div>
                                <h1 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600">
                                    時光魔法使的試煉
                                </h1>
                                <p className="text-gray-300 text-xs mt-1 font-mono tracking-widest uppercase">CASE FILE: UNIT-08 / TIME_DUNGEON</p>
                            </div>

                            {studentClass && studentSeat && (
                                <div className="text-xs text-purple-300 font-mono bg-purple-950/40 border border-purple-800/40 px-4 py-1.5 rounded-full inline-block">
                                    🧙‍♂️ 魔法使代號：{studentClass} 班 {studentSeat} 號
                                    <button onClick={() => setShowLoginModal(true)} className="ml-3 underline text-purple-400 hover:text-purple-200">修改</button>
                                </div>
                            )}

                            <div className="text-left bg-black/30 p-4 rounded-lg text-sm text-gray-300 border border-purple-900/30">
                                <p className="font-bold text-white mb-2">📜 魔法規則：</p>
                                <ul className="list-disc pl-5 space-y-1">
                                    <li>共 3 個關卡，每關 4 題。</li>
                                    <li>一次答對獲得 <span className="text-green-400 font-bold">20分</span>！</li>
                                    <li>答錯會開啟提示，分數降為 10分 ➔ 5分 ➔ 0分。</li>
                                    <li>慢慢算，魔法世界沒有時間限制！</li>
                                </ul>
                            </div>
                            
                            <div className="flex flex-col sm:flex-row gap-3">
                                <button onClick={startGame} className="w-full py-4 rounded-xl font-bold text-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 magic-btn shadow-lg">
                                    開始魔法試煉
                                </button>
                                <a href="../index.html" className="w-full py-4 rounded-xl font-bold text-xl bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-900/40 flex items-center justify-center">
                                    返回大廳
                                </a>
                            </div>
                            
                            {localStorage.getItem(`answered_math_questions_8_${studentClass}_${studentSeat}`) && (
                                <button onClick={() => {
                                    if(confirm("確定要清除所有答對的歷史紀錄，重新開始嗎？")) {
                                        localStorage.removeItem(`answered_math_questions_8_${studentClass}_${studentSeat}`);
                                        alert("已重置學習進度！");
                                        window.location.reload();
                                    }
                                }} className="text-xs text-slate-400 hover:text-slate-300 underline mt-2 transition-colors touch-manipulation">
                                    重置學習進度 (清除已答對紀錄)
                                </button>
                            )}
                        </div>
                    </div>
                );
            }

            if (gameState === 'end') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-purple-900 to-black">
                        <div className="glass-panel p-6 md:p-8 max-w-lg w-full text-center fade-in space-y-5">
                            <div className="flex justify-center text-yellow-400">
                                <Icons.Star />
                            </div>
                            <h1 className="text-3xl font-bold text-white">試煉完成！</h1>
                            
                            <div className="bg-black/30 p-5 rounded-2xl border border-purple-800/30 w-full max-w-xs mx-auto shadow-inner">
                                <div className="text-gray-400 text-xs md:text-sm uppercase tracking-widest mb-1 font-mono">你的魔力積分</div>
                                <div className="text-5xl md:text-6xl font-black text-yellow-400 font-mono">{score}</div>
                                <div className="text-gray-500 text-xs mt-2">滿分 240 分</div>
                                <div className="text-[10px] text-purple-300 font-mono mt-1 bg-purple-950/30 py-0.5 px-3 rounded-full inline-block border border-purple-900/40">
                                    登記者：{studentClass} 班 {studentSeat} 號
                                </div>
                            </div>

                            {score >= 200 ? (
                                <p className="text-green-400 font-bold text-lg">🏆 太厲害了！你已經是首席大魔法使！</p>
                            ) : score >= 150 ? (
                                <p className="text-blue-400 font-bold text-lg">做得很棒！合格的魔法使！</p>
                            ) : (
                                <p className="text-purple-400 font-bold text-lg">魔法還不夠熟練，請再挑戰一次吧！</p>
                            )}

                            {/* Firestore 即時排行榜 */}
                            <div className="bg-black/40 p-4 rounded-xl border border-purple-900/40 w-full text-left">
                                <h3 className="font-bold text-purple-200 flex items-center justify-center gap-2 mb-2 border-b border-purple-900/40 pb-1.5 text-xs md:text-sm font-mono">
                                    <Icons.Star />
                                    【即時排行榜】⏱️ 時光魔法使
                                </h3>
                                
                                {loadingLeaderboard ? (
                                    <div className="text-purple-400 text-xs py-5 font-mono text-center animate-pulse">正在共鳴魔力能量...</div>
                                ) : leaderboard.length > 0 ? (
                                    <div className="space-y-1 max-h-36 overflow-y-auto pr-1">
                                        {leaderboard.map((item, idx) => (
                                            <div key={idx} className={`flex justify-between items-center p-1.5 rounded text-xs font-mono ${item.class === studentClass && item.seat === studentSeat ? 'bg-purple-950/40 border border-purple-500/30' : 'bg-black/20'}`}>
                                                <div className="flex items-center gap-2">
                                                    <span className={`w-4 h-4 flex items-center justify-center rounded-full text-[9px] font-bold ${idx === 0 ? 'bg-yellow-400 text-slate-950' : idx === 1 ? 'bg-slate-350 text-slate-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-purple-300'}`}>
                                                        {idx + 1}
                                                    </span>
                                                    <span className="text-gray-300">{item.class} 班 {item.seat} 號</span>
                                                </div>
                                                <span className="text-yellow-400 font-bold">{item.score} 分</span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-gray-500 text-xs py-5 text-center">尚無連線紀錄</div>
                                )}
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3">
                                <button onClick={startGame} className="w-full py-3 rounded-xl font-bold text-lg bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 magic-btn">
                                    重新挑戰
                                </button>
                                <a href="../index.html" className="w-full py-3 rounded-xl font-bold text-lg bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-900/40 flex items-center justify-center">
                                    返回大廳
                                </a>
                            </div>
                        </div>
                    </div>
                );
            }

            // Playing State
            const currentQ = questions[qIndex];
            const levelTitles = ["第一關：破譯時光石碑 (12/24時制)", "第二關：鍊金術的等價交換 (時間換算)", "第三關：修復時空裂縫 (時間加減)"];

            return (
                <div className="min-h-screen p-4 md:p-8 bg-gradient-to-br from-indigo-900 via-purple-900 to-black flex flex-col items-center">
                    {/* Header */}
                    <div className="w-full max-w-3xl flex justify-between items-center mb-8 glass-panel p-4">
                        <div className="flex items-center gap-2 text-purple-300 font-bold">
                            <Icons.Book /> {levelTitles[currentLevel - 1]}
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-gray-300">題目: {qIndex + 1}/4</div>
                            <div className="text-xl font-black text-yellow-400 flex items-center gap-1">
                                <Icons.Star /> {score}
                            </div>
                        </div>
                    </div>

                    {/* Question Area */}
                    <div className="w-full max-w-3xl glass-panel p-8 mb-8 fade-in relative">
                        <h2 className="text-3xl md:text-4xl font-bold text-center leading-relaxed mb-8">
                            {currentQ.q}
                        </h2>

                        {/* Hint Area (強制開啟機制) */}
                        {showHint && (
                            <div className="mb-6 p-4 bg-yellow-900/50 border border-yellow-600 rounded-lg text-yellow-200 fade-in flex items-start gap-3">
                                <span>💡</span>
                                <div>
                                    <span className="font-bold">魔法提示：</span>{currentQ.hint}
                                </div>
                            </div>
                        )}

                        {/* Options */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {currentQ.options.map((opt, idx) => {
                                const isWrongAndDisabled = disabledOptions.includes(opt) && opt !== currentQ.ans;
                                const isCorrectAndLocked = disabledOptions.length > 0 && opt === currentQ.ans && isProcessingRef.current;
                                
                                let btnClass = "py-6 px-4 rounded-xl text-2xl font-bold magic-btn border-2 ";
                                if (isWrongAndDisabled) {
                                    btnClass += "bg-red-900/50 border-red-700 text-gray-400";
                                } else if (isCorrectAndLocked) {
                                    btnClass += "bg-green-600 border-green-400 text-white shadow-[0_0_20px_rgba(74,222,128,0.5)]";
                                } else {
                                    btnClass += "bg-indigo-800/80 border-indigo-500 hover:bg-indigo-700 text-white";
                                }

                                return (
                                    <button 
                                        key={idx}
                                        onClick={() => handleAnswer(opt)}
                                        disabled={isWrongAndDisabled || (isProcessingRef.current && !isCorrectAndLocked)}
                                        className={btnClass}
                                    >
                                        {opt}
                                    </button>
                                );
                            })}
                        </div>
                        
                        {/* 剩餘分數指示器 */}
                        <div className="mt-6 text-center text-sm text-gray-400">
                            本題剩餘可得積分：
                            <span className={`font-bold ml-2 ${mistakes === 0 ? 'text-green-400' : mistakes === 1 ? 'text-yellow-400' : 'text-red-400'}`}>
                                {mistakes === 0 ? 20 : mistakes === 1 ? 10 : mistakes === 2 ? 5 : 0} 分
                            </span>
                        </div>
                    </div>

                    {/* 班級座號登入浮窗 */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <form onSubmit={handleSaveLogin} className="bg-slate-900 border border-purple-500/30 p-6 md:p-8 rounded-3xl max-w-sm w-full space-y-6 shadow-[0_0_40px_rgba(167,139,250,0.2)] animate-pop-in text-center">
                                <div className="space-y-2">
                                    <div className="w-12 h-12 bg-purple-500/10 border border-purple-400/40 rounded-full flex items-center justify-center mx-auto text-purple-400 text-2xl">
                                        🔮
                                    </div>
                                    <h3 className="text-xl font-bold text-white">請登記魔法使身份</h3>
                                    <p className="text-slate-400 text-xs font-mono">登記後成績將自動上傳即時排行榜</p>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-mono text-purple-400 uppercase tracking-widest mb-1.5 text-left">班級 (Class)</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={studentClass} 
                                            onChange={(e) => setStudentClass(e.target.value)}
                                            placeholder="例如：305" 
                                            className="w-full bg-slate-950 border border-slate-750 focus:border-purple-500 rounded-xl px-4 py-3 text-white outline-none transition-colors text-sm font-mono text-left"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-mono text-purple-400 uppercase tracking-widest mb-1.5 text-left">座號 (Seat No.)</label>
                                        <input 
                                            type="number" 
                                            required
                                            min="1"
                                            max="100"
                                            value={studentSeat} 
                                            onChange={(e) => setStudentSeat(e.target.value)}
                                            placeholder="例如：12" 
                                            className="w-full bg-slate-950 border border-slate-755 focus:border-purple-500 rounded-xl px-4 py-3 text-white outline-none transition-colors text-sm font-mono text-left"
                                        />
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    className="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black rounded-xl shadow-lg transition-all"
                                >
                                    開始魔法挑戰
                                </button>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
