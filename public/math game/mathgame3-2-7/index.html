                    { text: "5 × ( ? ) = 405。醫療艙需要的藥水數量算法？", correctOption: "405 ÷ 5", wrongOptions: ["405 × 5", "405 - 5", "405 + 5"], hint: "💡 提示：用積(405)除以另一個數字(5)就對了。" }
                ]
            },
            3: {
                title: "第三關：修復航行軌道",
                subtitle: "活動3：被除數或除數未知的問題",
                pool: [
                    { text: "( ? ) ÷ 3 = 24。請找出原本的軌道總長度！該怎麼算？", correctOption: "24 × 3", wrongOptions: ["24 ÷ 3", "24 + 3", "24 - 3"], hint: "💡 提示：要求未知的「被除數（最前面的數字）」，要把商(24)和除數(3)乘起來喔！" },
                    { text: "224 ÷ ( ? ) = 8。軌道被平分成了幾段？請選出算法。", correctOption: "224 ÷ 8", wrongOptions: ["224 × 8", "224 + 8", "224 - 8"], hint: "💡 提示：要求未知的「除數（中間的數字）」，        // 改用 Inline SVG 避免 React DOM 被外部腳本修改導致當機
        const Icon = ({ name, className }) => {
            const icons = {

                'circle-help': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>,
                'circle-x': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>,

                'refresh-ccw': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>,
                'home': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
                'badge': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            };
            return icons[name] || null;
        };

        function SpaceMathGame() {
            const [gameState, setGameState] = useState('START');
            const [level, setLevel] = useState(1);
            const [questions, setQuestions] = useState([]);
            const [qIndex, setQIndex] = useState(0);
            const [score, setScore] = useState(0);
            
            // 學生登入資料
            const [studentClass, setStudentClass] = useState(localStorage.getItem('student_class') || '');
            const [studentSeat, setStudentSeat] = useState(localStorage.getItem('student_seat') || '');
            const [showLoginModal, setShowLoginModal] = useState(false);

            // 排行榜資料
            const [leaderboard, setLeaderboard] = useState([]);
            const [loadingLeaderboard, setLoadingLeaderboard] = useState(false);
            
            const [questionPotentialScore, setQuestionPotentialScore] = useState(20);
            const [lockedOptions, setLockedOptions] = useState([]);
            const [showHint, setShowHint] = useState(false);
            
            const [feedback, setFeedback] = useState(null); 
            const [currentOptions, setCurrentOptions] = useState([]);
            const [correctIndex, setCorrectIndex] = useState(-1);
            const [selectedOptionIndex, setSelectedOptionIndex] = useState(null);

            // 確保有班級座號
            useEffect(() => {
                const storedClass = localStorage.getItem('student_class');
                const storedSeat = localStorage.getItem('student_seat');
                if (!storedClass || !storedSeat) {
                    setShowLoginModal(true);
                }
            }, []);

            // 2. 建立不重複題庫的抽題機制，以及防止連點的機制
            const availableQsRef = useRef({
                1: shuffleArray([...GAME_DATA[1].pool]),
                2: shuffleArray([...GAME_DATA[2].pool]),
                3: shuffleArray([...GAME_DATA[3].pool])
            });
            const isProcessingRef = useRef(false);

            // 3. 修改抽題邏輯：從題庫陣列中「拿走」題目，直到沒題目才重新洗牌
            // 3. 修改抽題邏輯：結合 localStorage 過濾掉已答對的題目，防止重複測驗
            const initLevel = useCallback((levelNum) => {
                const QUESTIONS_PER_LEVEL = 4;
                
                // 從 localStorage 讀取已答對的題目
                const answeredQuestions = JSON.parse(localStorage.getItem('answered_math_questions') || '[]');
                
                // 過濾掉該關卡中已經答對過的題目
                let eligiblePool = GAME_DATA[levelNum].pool.filter(q => !answeredQuestions.includes(q.text));
                
                // 如果該關卡剩餘未做對的題目不足 4 題，則清除該關卡在此儲存庫中的答對歷史紀錄，以防學生無題可做
                if (eligiblePool.length < QUESTIONS_PER_LEVEL) {
                    const poolTexts = GAME_DATA[levelNum].pool.map(q => q.text);
                    const updatedAnswers = answeredQuestions.filter(text => !poolTexts.includes(text));
                    localStorage.setItem('answered_math_questions', JSON.stringify(updatedAnswers));
                    eligiblePool = GAME_DATA[levelNum].pool;
                }
                
                // 洗牌並抽取 4 題
                const shuffled = shuffleArray([...eligiblePool]);
                const selectedQuestions = shuffled.slice(0, QUESTIONS_PER_LEVEL);

                setQuestions(selectedQuestions);
                setQIndex(0);
                setupQuestion(selectedQuestions[0]);
            }, []);

            const setupQuestion = (question) => {
                if (!question) return;
                const options = [question.correctOption, ...question.wrongOptions];
                const shuffledOptions = shuffleArray(options);
                setCurrentOptions(shuffledOptions);
                setCorrectIndex(shuffledOptions.indexOf(question.correctOption));
                
                setQuestionPotentialScore(20);
                setLockedOptions([]);
                setShowHint(false);
                setFeedback(null);
                setSelectedOptionIndex(null);
                isProcessingRef.current = false; // 換題時重置防止連點的鎖
            };

            const startGame = () => {
                if (!studentClass || !studentSeat) {
                    setShowLoginModal(true);
                    return;
                }
                setGameState('PLAYING');
                setScore(0);
                setLevel(1);
                initLevel(1);
            };

            const handleShowHint = () => {
                setShowHint(true);
                setQuestionPotentialScore(prev => Math.min(prev, 10));
            };

            // 4. 修改計分邏輯：加入 isProcessingRef 鎖定，阻擋「瘋狂連點」
            const handleAnswer = (index) => {
                // 如果正在處理中(已鎖定)，或者已經答對，就直接擋掉後續的點擊
                if (isProcessingRef.current || feedback === 'correct' || lockedOptions.includes(index)) return;

                setSelectedOptionIndex(index);

                if (index === correctIndex) {
                    isProcessingRef.current = true; // 答對時立即鎖定，防止連點加分
                    setFeedback('correct');
                    const pts = questionPotentialScore;
                    const newScore = score + pts;
                    setScore(prev => prev + pts);
                    
                    // 將答對的題目文字存入 localStorage 記憶中
                    const answered = JSON.parse(localStorage.getItem('answered_math_questions') || '[]');
                    const qText = questions[qIndex]?.text;
                    if (qText && !answered.includes(qText)) {
                        answered.push(qText);
                        localStorage.setItem('answered_math_questions', JSON.stringify(answered));
                    }

                    setTimeout(() => nextQuestion(newScore), 1500);
                } else {
                    isProcessingRef.current = true; // 答錯時也短暫鎖定避免動畫出錯
                    setFeedback('incorrect');
                    setLockedOptions(prev => [...prev, index]);
                    
                    let newPotentialScore = questionPotentialScore - 5;
                    if (!showHint) {
                        setShowHint(true);
                        newPotentialScore = Math.min(newPotentialScore, 10);
                    }
                    setQuestionPotentialScore(Math.max(0, newPotentialScore));

                    setTimeout(() => {
                        setFeedback(null);
                        setSelectedOptionIndex(null);
                        isProcessingRef.current = false; // 放開鎖定
                    }, 800);
                }
            };

            const nextQuestion = (currentScore) => {
                if (qIndex + 1 < questions.length) {
                    const nextIdx = qIndex + 1;
                    setQIndex(nextIdx);
                    setupQuestion(questions[nextIdx]);
                } else {
                    if (level < 3) {
                        const nextLevel = level + 1;
                        setLevel(nextLevel);
                        initLevel(nextLevel);
                    } else {
                        setGameState('END');
                        submitScoreAndFetchLeaderboard(currentScore);
                    }
                }
            };

            const submitScoreAndFetchLeaderboard = async (finalScore) => {
                if (!db) return;
                setLoadingLeaderboard(true);
                const payload = {
                    class: studentClass.trim(),
                    seat: studentSeat.trim(),
                    score: finalScore,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };
                try {
                    await db.collection("math_game_scores_7").add(payload);
                    const snapshot = await db.collection("math_game_scores_7")
                        .orderBy("score", "desc")
                        .limit(50)
                        .get();
                    const list = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        list.push({
                            class: data.class,
                            seat: data.seat,
                            score: data.score,
                            timestamp: data.timestamp ? data.timestamp.toDate() : new Date()
                        });
                    });
                    list.sort((a, b) => {
                        if (b.score !== a.score) {
                            return b.score - a.score;
                        }
                        return a.timestamp - b.timestamp;
                    });
                    setLeaderboard(list.slice(0, 20));
                } catch (err) {
                    console.error("Firebase submit/query failed:", err);
                } finally {
                    setLoadingLeaderboard(false);
                }
            };

            const handleSaveLogin = (e) => {
                e.preventDefault();
                if (studentClass.trim() && studentSeat.trim()) {
                    localStorage.setItem('student_class', studentClass.trim());
                    localStorage.setItem('student_seat', studentSeat.trim());
                    setShowLoginModal(false);
                }
            };

            const renderStartScreen = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] text-center animate-pop-in space-y-6 px-4">
                    <div className="relative">
                        <Icon name="rocket" className="w-20 h-20 md:w-28 md:h-28 text-blue-400 animate-float" />
                        <Icon name="sparkles" className="w-8 h-8 text-yellow-400 absolute top-0 right-0 animate-pulse" />
                    </div>
                    <h1 className="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 tracking-wider drop-shadow-sm leading-tight">
                        星際數學救援行動
                    </h1>

                    {studentClass && studentSeat && (
                        <div className="text-sm text-blue-300/80 font-mono bg-blue-950/30 border border-blue-800/40 px-4 py-2 rounded-full">
                            🚀 太空人代號：{studentClass} 班 {studentSeat} 號
                            <button onClick={() => setShowLoginModal(true)} className="ml-3 underline text-blue-400 hover:text-blue-200">修改</button>
                        </div>
                    )}
                    
                    <div className="bg-slate-800 p-4 md:p-6 rounded-2xl text-left text-sm md:text-base text-slate-300 w-full max-w-md shadow-inner border border-slate-700">
                        <h3 className="font-bold text-white flex items-center gap-2 mb-3">
                            <Icon name="triangle-alert" className="w-5 h-5 text-yellow-400" />
                            太空總署計分規則
                        </h3>
                        <ul className="space-y-3">
                            <li className="flex items-start gap-2">
                                <Icon name="circle-check" className="w-5 h-5 text-green-400 shrink-0 mt-0.5" />
                                <span><strong className="text-green-300">一次答對：</strong>獲得完美 20 點能量。</span>
                            </li>
                            <li className="flex items-start gap-2">
                                <Icon name="circle-help" className="w-5 h-5 text-blue-400 shrink-0 mt-0.5" />
                                <span><strong className="text-blue-300">使用提示：</strong>最高只能獲得 10 點能量。</span>
                            </li>
                            <li className="flex items-start gap-2">
                                <Icon name="circle-x" className="w-5 h-5 text-red-400 shrink-0 mt-0.5" />
                                <span><strong className="text-red-300">猜錯扣分：</strong>點錯一次扣 5 點能量，並<strong className="text-red-300">強制開啟提示</strong>！瞎猜是拿不到高分的喔！</span>
                            </li>
                        </ul>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-4 w-full max-w-xs">
                        <button onClick={startGame} className="w-full py-4 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 text-white text-lg md:text-xl font-bold rounded-2xl shadow-[0_0_20px_rgba(59,130,246,0.4)] transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2 touch-manipulation">
                            <Icon name="rocket" className="w-5 h-5" />
                            接受挑戰
                        </button>
                        <a href="../index.html" className="w-full py-4 bg-slate-800 hover:bg-slate-700 text-blue-300 text-lg md:text-xl font-bold rounded-2xl transition-all border border-blue-800/40 flex items-center justify-center gap-2">
                            <Icon name="home" className="w-5 h-5" />
                            返回大廳
                        </a>
                    </div>
                    {localStorage.getItem('answered_math_questions') && (
                        <button onClick={() => {
                            if(confirm("確定要清除所有答對的歷史紀錄，重新開始嗎？")) {
                                localStorage.removeItem('answered_math_questions');
                                alert("已重置學習進度！");
                                window.location.reload();
                            }
                        }} className="text-xs text-slate-500 hover:text-slate-300 underline mt-2 transition-colors touch-manipulation">
                            重置學習進度 (清除已答對紀錄)
                        </button>
                    )}
                </div>
            );

            const renderPlayingScreen = () => {
                if (!questions || questions.length === 0) return null;
                const currentLevelData = GAME_DATA[level];
                const currentQuestion = questions[qIndex];

                return (
                    <div className="flex flex-col w-full max-w-3xl mx-auto animate-pop-in px-2 md:px-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 md:mb-6 bg-slate-800/90 p-4 md:p-5 rounded-2xl border border-slate-700 shadow-lg gap-4">
                            <div>
                                <div className="text-[10px] md:text-xs text-blue-400 font-bold uppercase tracking-wider mb-1">{currentLevelData.subtitle}</div>
                                <div className="text-lg md:text-xl font-bold text-white flex items-center gap-2">
                                    <Icon name="shield-check" className="w-5 h-5 text-indigo-400 shrink-0" />
                                    {currentLevelData.title}
                                </div>
                            </div>
                            <div className="flex items-center gap-6 w-full md:w-auto justify-between md:justify-end">
                                <div className="text-left md:text-right">
                                    <div className="text-[10px] md:text-xs text-slate-400 uppercase">總分 Score</div>
                                    <div className="text-xl md:text-2xl font-black text-yellow-400">{score}</div>
                                </div>
                                <div className="text-right">
                                    <div className="text-[10px] md:text-xs text-slate-400 uppercase">進度 Progress</div>
                                    <div className="text-base md:text-lg font-bold text-white bg-slate-700 px-3 py-1 rounded-full whitespace-nowrap">
                                        {qIndex + 1} / {questions.length}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 rounded-3xl p-5 md:p-8 shadow-2xl border border-slate-600 relative overflow-hidden flex flex-col">
                            <div className="absolute top-[-20px] right-[-20px] opacity-10 pointer-events-none">
                                <Icon name="star" className="w-40 h-40 md:w-56 md:h-56 text-white" />
                            </div>

                            <div className="self-end bg-slate-900 border border-slate-700 px-4 py-2 rounded-full mb-4 flex items-center gap-2 z-10">
                                <span className="text-xs text-slate-400">本題最高可得:</span>
                                <span key={questionPotentialScore} className="text-lg font-bold text-green-400 animate-flash-red">
                                    +{questionPotentialScore}
                                </span>
                            </div>

                            <h2 className="text-xl md:text-3xl font-bold text-white leading-relaxed relative z-10 mb-6 md:mb-10 break-words min-h-[80px]">
                                {currentQuestion.text}
                            </h2>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-5 relative z-10">
                                {currentOptions.map((option, index) => {
                                    const isLocked = lockedOptions.includes(index);
                                    let buttonStyle = "bg-slate-700 hover:bg-slate-600 border-slate-500 text-slate-100 active:scale-95 active:border-b-0 active:translate-y-1";
                                    
                                    if (isLocked) {
                                        buttonStyle = "bg-slate-800 border-slate-700 text-slate-600 opacity-50 cursor-not-allowed";
                                    } else if (selectedOptionIndex === index) {
                                        if (feedback === 'correct') {
                                            buttonStyle = "bg-green-500 border-green-400 text-white shadow-[0_0_15px_rgba(34,197,94,0.6)] z-20 scale-105";
                                        } else if (feedback === 'incorrect') {
                                            buttonStyle = "bg-red-500 border-red-400 text-white animate-shake";
                                        }
                                    } else if (feedback === 'correct') {
                                        buttonStyle = "bg-slate-800 border-slate-700 text-slate-500 opacity-50 cursor-not-allowed";
                                    }

                                    return (
                                        <button
                                            key={index}
                                            onClick={() => handleAnswer(index)}
                                            disabled={feedback === 'correct' || isLocked}
                                            className={`relative min-h-[64px] md:min-h-[80px] p-4 rounded-2xl border-b-4 text-lg md:text-2xl font-bold transition-all flex items-center justify-center gap-3 touch-manipulation select-none ${buttonStyle}`}
                                        >
                                            <span className={`${isLocked ? 'line-through decoration-red-500/50 decoration-2' : ''} font-mono tracking-wider`}>
                                                {option}
                                            </span>
                                            {selectedOptionIndex === index && feedback === 'correct' && <Icon name="circle-check" className="w-6 h-6 text-white absolute right-4" />}
                                            {isLocked && <Icon name="circle-x" className="w-6 h-6 text-red-500/50 absolute right-4" />}
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="mt-8 flex flex-col items-center relative z-10 min-h-[80px]">
                                {!showHint ? (
                                    <button onClick={handleShowHint} className="flex items-center gap-2 text-blue-300 hover:text-blue-100 bg-blue-900/40 hover:bg-blue-900/70 px-5 py-3 rounded-full transition-colors text-sm md:text-base border border-blue-800 touch-manipulation">
                                        <Icon name="circle-help" className="w-5 h-5" />
                                        呼叫機器人提示 (將扣除部分分數)
                                    </button>
                                ) : (
                                    <div className="bg-indigo-900/60 border border-indigo-400/50 text-indigo-100 p-4 md:p-5 rounded-2xl text-base md:text-lg animate-pop-in flex items-start gap-3 w-full shadow-inner">
                                        <div className="text-2xl md:text-3xl shrink-0">🤖</div>
                                        <div className="font-medium leading-relaxed mt-1">
                                            <span className="text-yellow-300 font-bold block mb-1">【系統強制學習模式開啟】</span>
                                            {currentQuestion.hint}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderEndScreen = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] text-center animate-pop-in space-y-6 px-4 py-6">
                    <div className="relative">
                        <div className="w-24 h-24 bg-blue-500/10 border-2 border-blue-400/50 rounded-full flex items-center justify-center animate-float shadow-[0_0_20px_rgba(59,130,246,0.2)]">
                            <Icon name="star" className="w-12 h-12 text-yellow-400" />
                        </div>
                        <Icon name="circle-check" className="w-6 h-6 text-emerald-400 absolute bottom-0 right-0 bg-slate-900 border border-slate-800 rounded-full p-1" />
                    </div>
                    
                    <h1 className="text-3xl md:text-5xl font-extrabold text-white tracking-wider drop-shadow-lg">
                        救援任務完成！
                    </h1>
                    
                    <div className="bg-slate-800 p-6 rounded-2xl border border-blue-500/20 mt-4 w-full max-w-sm shadow-[0_0_30px_rgba(59,130,246,0.1)] relative overflow-hidden">
                        <div className="text-slate-400 text-xs md:text-sm uppercase tracking-widest mb-1">最終獲得能量積分</div>
                        <div className="text-5xl md:text-6xl font-black text-yellow-400 font-mono">{score}</div>
                        <div className="text-slate-500 text-xs mt-3">滿分 240 分</div>
                        <div className="text-[10px] text-blue-300/80 font-mono mt-1 bg-blue-950/30 py-1 px-3 rounded-full inline-block">
                            登記者：{studentClass} 班 {studentSeat} 號
                        </div>
                    </div>

                    {/* Firestore 即時排行榜 */}
                    <div className="bg-slate-950/80 p-5 rounded-2xl border border-slate-800 w-full max-w-md">
                        <h3 className="font-bold text-white flex items-center gap-2 mb-3 border-b border-slate-800 pb-2 text-sm md:text-base">
                            <Icon name="badge" className="w-4 h-4 text-yellow-400" />
                            【即時排行榜】🧮 星際救援
                        </h3>
                        
                        {loadingLeaderboard ? (
                            <div className="text-slate-400 text-sm py-8 font-mono animate-pulse">正在調取雷達數據...</div>
                        ) : leaderboard.length > 0 ? (
                            <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                                {leaderboard.map((item, idx) => (
                                    <div key={idx} className={`flex justify-between items-center p-2 rounded text-xs md:text-sm font-mono ${item.class === studentClass && item.seat === studentSeat ? 'bg-blue-950/40 border border-blue-500/30' : 'bg-slate-900/50'}`}>
                                        <div className="flex items-center gap-3">
                                            <span className={`w-5 h-5 flex items-center justify-center rounded-full text-[10px] font-bold ${idx === 0 ? 'bg-yellow-400 text-slate-950' : idx === 1 ? 'bg-slate-300 text-slate-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                                {idx + 1}
                                            </span>
                                            <span className="text-slate-200">{item.class} 班 {item.seat} 號</span>
                                        </div>
                                        <span className="text-yellow-400 font-bold">{item.score} 分</span>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-slate-500 text-xs py-8">尚無挑戰數據，你是第一位救援者！</div>
                        )}
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onClick={startGame} className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white text-base md:text-lg font-extrabold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg">
                            <Icon name="refresh-ccw" className="w-4 h-4" />
                            重新挑戰
                        </button>
                        <a href="../index.html" className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-blue-300 text-base md:text-lg font-bold rounded-xl transition-all border border-blue-800/40 flex items-center justify-center gap-2">
                            <Icon name="home" className="w-4 h-4" />
                            返回大廳
                        </a>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-900 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center py-8 font-sans">
                    <div className="w-full max-w-4xl">
                        {gameState === 'START' && renderStartScreen()}
                        {gameState === 'PLAYING' && renderPlayingScreen()}
                        {gameState === 'END' && renderEndScreen()}
                    </div>

                    {/* 班級座號登入浮窗 */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <form onSubmit={handleSaveLogin} className="bg-slate-900 border border-blue-500/30 p-6 md:p-8 rounded-3xl max-w-sm w-full space-y-6 shadow-[0_0_40px_rgba(59,130,246,0.2)] animate-pop-in">
                                <div className="text-center space-y-2">
                                    <div className="w-12 h-12 bg-blue-500/10 border border-blue-400/40 rounded-full flex items-center justify-center mx-auto text-blue-400">
                                        🚀
                                    </div>
                                    <h3 className="text-xl font-bold text-white">請登記太空人身份</h3>
                                    <p className="text-slate-400 text-xs font-mono">登記後成績將自動上傳即時排行榜</p>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-mono text-blue-400 uppercase tracking-widest mb-1.5">班級 (Class)</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={studentClass} 
                                            onChange={(e) => setStudentClass(e.target.value)}
                                            placeholder="例如：305" 
                                            className="w-full bg-slate-950 border border-slate-750 focus:border-blue-500 rounded-xl px-4 py-3 text-white outline-none transition-colors text-sm font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-mono text-blue-400 uppercase tracking-widest mb-1.5">座號 (Seat No.)</label>
                                        <input 
                                            type="number" 
                                            required
                                            min="1"
                                            max="100"
                                            value={studentSeat} 
                                            onChange={(e) => setStudentSeat(e.target.value)}
                                            placeholder="例如：12" 
                                            className="w-full bg-slate-950 border border-slate-755 focus:border-blue-500 rounded-xl px-4 py-3 text-white outline-none transition-colors text-sm font-mono"
                                        />
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    className="w-full py-3 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 text-white font-black rounded-xl shadow-lg transition-all"
                                >
                                    完成登記，開始挑戰
                                </button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpaceMathGame />);
    </script>
</body>
</html>
