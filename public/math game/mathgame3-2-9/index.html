        function generateLevel1Pool(dataset) {
            const title = dataset.title;
            const item = dataset.itemType;
            const items = dataset.items;
            const sorted = [...items].sort((a, b) => a.price - b.price);
            const cheapest = sorted[0];
            const med = sorted[1];
            const mostExp = sorted[2];
            
            return [
                {
                    text: "根據" + title + "，哪一種" + item + "的售價最高（最貴）？",
                    correctOption: mostExp.name,
                    wrongOptions: [med.name, cheapest.name, "都一樣"],
                    hint: "💡 提示：比較三種" + item + "的價格：" + mostExp.price + "元 > " + med.price + "元 > " + cheapest.price + "元。"
                },
                {
                    text: "如果買一" + cheapest.unit + cheapest.name + "和一" + med.unit + med.name + "，共要付多少元？",
                    correctOption: (cheapest.price + med.price) + "元",
                    wrongOptions: [(cheapest.price + med.price + 20) + "元", (cheapest.price + med.price - 10) + "元", (cheapest.price + med.price + 10) + "元"],
                    hint: "💡 提示：" + cheapest.name + "一" + cheapest.unit + cheapest.price + "元，" + med.name + "一" + med.unit + med.price + "元，把它們加起來。"
                },
                {
                    text: "一" + med.unit + med.name + " " + med.price + " 元，買兩" + med.unit + "共要多少元？",
                    correctOption: (med.price * 2) + "元",
                    wrongOptions: [(med.price * 2 - 20) + "元", (med.price * 2 + 10) + "元", (med.price * 2 - 10) + "元"],
                    hint: "💡 提示：一" + med.unit + med.price + "元，兩" + med.unit + "就是 " + med.price + " × 2 = " + (med.price * 2) + " 元。"
                },
                {
                    text: "小明拿 100 元去買一" + mostExp.unit + mostExp.name + "，應該找回多少元？",
                    correctOption: (100 - mostExp.price) + "元",
                    wrongOptions: [(100 - mostExp.price + 5) + "元", (100 - mostExp.price + 10) + "元", "0元"],
                    hint: "💡 提示：用 100 元減去" + mostExp.name + "的售價：100 - " + mostExp.price + " = " + (100 - mostExp.price) + " 元。"
                },
                {
                    text: "根據" + title + "，哪一種" + item + "的售價最低（最便宜）？",
                    correctOption: cheapest.name,
                    wrongOptions: [med.name, mostExp.name, "一樣便宜"],
                    hint: "💡 提示：對照表格價格：" + cheapest.name + " " + cheapest.price + "元、" + med.name + " " + med.price + "元、" + mostExp.name + " " + mostExp.price + "元。"
                },
                {
                    text: "一" + med.unit + med.name + "比一" + cheapest.unit + cheapest.name + "貴多少元？",
                    correctOption: (med.price - cheapest.price) + "元",
                    wrongOptions: [(med.price - cheapest.price - 10) + "元", (med.price - cheapest.price + 10) + "元", (med.price - cheapest.price - 5) + "元"],
                    hint: "💡 提示：求相差用減法：" + med.name + "的價格 " + med.price + "元 減去 " + cheapest.name + "的價格 " + cheapest.price + "元。"
                },
                {
                    text: "小華買了一" + cheapest.unit + cheapest.name + "和一" + mostExp.unit + mostExp.name + "，付了一張 200 元鈔票，應找回多少元？",
                    correctOption: (200 - (cheapest.price + mostExp.price)) + "元",
                    wrongOptions: [(200 - (cheapest.price + mostExp.price) - 10) + "元", (200 - (cheapest.price + mostExp.price) + 20) + "元", (200 - (cheapest.price + mostExp.price) - 20) + "元"],
                    hint: "💡 提示：先算兩樣商品加起來是 " + cheapest.price + " + " + mostExp.price + " = " + (cheapest.price + mostExp.price) + " 元，再用 200 扣除。"
                },
                {
                    text: "如果買三個" + cheapest.name + "，共要付多少元？",
                    correctOption: (cheapest.price * 3) + "元",
                    wrongOptions: [(cheapest.price * 2) + "元", (cheapest.price * 3 - 10) + "元", (cheapest.price * 3 + 10) + "元"],
                    hint: "💡 提示：一個" + cheapest.price + "元，三個就是 " + cheapest.price + " × 3 = " + (cheapest.price * 3) + " 元。"
                },
                {
                    text: "一" + mostExp.unit + mostExp.name + "比一" + med.unit + med.name + "貴多少元？",
                    correctOption: (mostExp.price - med.price) + "元",
                    wrongOptions: [(mostExp.price - med.price - 10) + "元", (mostExp.price - med.price + 10) + "元", (mostExp.price - med.price - 5) + "元"],
                    hint: "💡 提示：相差為：" + mostExp.price + " - " + med.price + " = " + (mostExp.price - med.price) + " 元。"
                },
                {
                    text: "小明有 150 元，買了一" + mostExp.unit + mostExp.name + "後，還剩下多少元？",
                    correctOption: (150 - mostExp.price) + "元",
                    wrongOptions: [(150 - mostExp.price - 10) + "元", (150 - mostExp.price + 10) + "元", (150 - mostExp.price + 20) + "元"],
                    hint: "💡 提示：150 - " + mostExp.price + " = " + (150 - mostExp.price) + " 元。"
                },
                {
                    text: "買一" + med.unit + med.name + "和一" + cheapest.unit + cheapest.name + "，付了一張 100 元，應找回多少元？",
                    correctOption: (100 - (med.price + cheapest.price)) + "元",
                    wrongOptions: [(100 - (med.price + cheapest.price) - 10) + "元", (100 - (med.price + cheapest.price) + 10) + "元", "0元"],
                    hint: "💡 提示：兩者合起來是 " + med.price + " + " + cheapest.price + " = " + (med.price + cheapest.price) + " 元。"
                },
                {
                    text: "買三" + med.unit + med.name + "共要多少元？",
                    correctOption: (med.price * 3) + "元",
                    wrongOptions: [(med.price * 2) + "元", (med.price * 3 - 20) + "元", (med.price * 3 + 20) + "元"],
                    hint: "💡 提示：一" + med.unit + med.price + "元，三" + med.unit + "就是 " + med.price + " × 3 = " + (med.price * 3) + " 元。"
                },
                {
                    text: "根據" + title + "，買一" + mostExp.unit + mostExp.name + "的錢可以買幾個" + cheapest.name + "？（若有餘數請以最大可買數量回答）",
                    correctOption: Math.floor(mostExp.price / cheapest.price) + "個",
                    wrongOptions: [(Math.floor(mostExp.price / cheapest.price) - 1) + "個", (Math.floor(mostExp.price / cheapest.price) + 1) + "個", "2個"],
                    hint: "💡 提示：用除法計算：" + mostExp.price + " ÷ " + cheapest.price + " = " + Math.floor(mostExp.price / cheapest.price) + "。"
                },
                {
                    text: "小紅買了兩" + med.unit + med.name + "，付了一張 500 元，應該找回多少元？",
                    correctOption: (500 - (med.price * 2)) + "元",
                    wrongOptions: [(500 - (med.price * 2) - 20) + "元", (500 - (med.price * 2) + 30) + "元", (500 - (med.price * 2) - 10) + "元"],
                    hint: "💡 提示：兩" + med.unit + "總價 " + (med.price * 2) + " 元。用 500 元去減即可。"
                },
                {
                    text: "三種" + item + "各買一個，一共需要多少元？",
                    correctOption: (cheapest.price + med.price + mostExp.price) + "元",
                    wrongOptions: [(cheapest.price + med.price + mostExp.price - 20) + "元", (cheapest.price + med.price + mostExp.price + 20) + "元", (cheapest.price + med.price + mostExp.price - 10) + "元"],
                    hint: "💡 提示：將三種品項的價格相加：" + cheapest.price + " + " + med.price + " + " + mostExp.price + " = " + (cheapest.price + med.price + mostExp.price) + " 元。"
                }
            ];
        }

        function generateLevel2Pool(dataset) {
            const title = dataset.title;
            const col0 = dataset.colLabels[0];
            const col1 = dataset.colLabels[1];
            const col2 = dataset.colLabels[2];
            const row0 = dataset.rowLabels[0];
            const row1 = dataset.rowLabels[1];
            const colType = dataset.colType;
            const rowType = dataset.rowType;
            const unit = dataset.unit;
            const data = dataset.data;
            
            const colTotals = dataset.colLabels.map(col => ({ name: col, total: data["合計"][col] }));
            colTotals.sort((a, b) => b.total - a.total);
            const colMax = colTotals[0].name;
            const colMin = colTotals[colTotals.length - 1].name;
            
            return [
                {
                    text: "對照" + title + "，" + col0 + "的" + row0 + "有幾" + unit + "？",
                    correctOption: data[row0][col0] + unit,
                    wrongOptions: [data[row1][col0] + unit, data[row0][col1] + unit, data["合計"][col0] + unit],
                    hint: "💡 提示：直向對應『" + col0 + "』，橫向對應『" + row0 + "』，兩者交叉點的數字是 " + data[row0][col0] + unit + "。"
                },
                {
                    text: "對照" + title + "，" + col1 + "的" + row0 + "有幾" + unit + "？",
                    correctOption: data[row0][col1] + unit,
                    wrongOptions: [data[row1][col1] + unit, data[row0][col0] + unit, data["合計"][col1] + unit],
                    hint: "💡 提示：直向對應『" + col1 + "』，橫向對應『" + row0 + "』，兩者交叉點的數字 is " + data[row0][col1] + unit + "。"
                },
                {
                    text: "所有" + colType + "的" + row1 + "一共有幾" + unit + "？",
                    correctOption: data[row1]["合計"] + unit,
                    wrongOptions: [data[row0]["合計"] + unit, data["合計"]["合計"] + unit, data[row1][col0] + unit],
                    hint: "💡 提示：尋找『合計(" + unit + ")』那一行與『" + row1 + "』那一列的交叉點，數值是 " + data[row1]["合計"] + unit + "。"
                },
                {
                    text: "哪一個" + colType + "的總人數最多？",
                    correctOption: colMax,
                    wrongOptions: dataset.colLabels.filter(c => c !== colMax).concat("都一樣多"),
                    hint: "💡 提示：比較最下方的各" + colType + "合計數值。"
                },
                {
                    text: "所有" + colType + "的" + row0 + "一共有幾" + unit + "？",
                    correctOption: data[row0]["合計"] + unit,
                    wrongOptions: [data[row1]["合計"] + unit, data["合計"]["合計"] + unit, data[row0][col1] + unit],
                    hint: "💡 提示：尋找『合計(" + unit + ")』與『" + row0 + "』交叉點的數值，是 " + data[row0]["合計"] + unit + "。"
                },
                {
                    text: "對照" + title + "，" + col2 + "的" + row1 + "有幾" + unit + "？",
                    correctOption: data[row1][col2] + unit,
                    wrongOptions: [data[row0][col2] + unit, data[row1][col0] + unit, data["合計"][col2] + unit],
                    hint: "💡 提示：直向尋找『" + col2 + "』，橫向尋找『" + row1 + "』，交叉格子對應的值是 " + data[row1][col2] + unit + "。"
                },
                {
                    text: "所有項目合計（總人數）共有幾" + unit + "？",
                    correctOption: data["合計"]["合計"] + unit,
                    wrongOptions: [data[row0]["合計"] + unit, data[row1]["合計"] + unit, data["合計"][col0] + unit],
                    hint: "💡 提示：看表格右下角的最總合計（" + row0 + "合計與" + row1 + "合計加起來，或是各" + colType + "合計加起來的值）。"
                },
                {
                    text: "對照" + title + "，" + col1 + "的" + row1 + "有幾" + unit + "？",
                    correctOption: data[row1][col1] + unit,
                    wrongOptions: [data[row0][col1] + unit, data[row1][col0] + unit, data["合計"][col1] + unit],
                    hint: "💡 提示：直向尋找『" + col1 + "』，橫向尋找『" + row1 + "』，交叉格子對應的值是 " + data[row1][col1] + unit + "。"
                },
                {
                    text: "對照" + title + "，" + col0 + "的" + row1 + "有幾" + unit + "？",
                    correctOption: data[row1][col0] + unit,
                    wrongOptions: [data[row0][col0] + unit, data[row1][col1] + unit, data["合計"][col0] + unit],
                    hint: "💡 提示：直向尋找『" + col0 + "』，橫向尋找『" + row1 + "』，交叉點的數字是 " + data[row1][col0] + unit + "。"
                },
                {
                    text: "對照" + title + "，" + col2 + "的" + row0 + "有幾" + unit + "？",
                    correctOption: data[row0][col2] + unit,
                    wrongOptions: [data[row1][col2] + unit, data[row0][col0] + unit, data["合計"][col2] + unit],
                    hint: "💡 提示：直向尋找『" + col2 + "』，橫向尋找『" + row0 + "』，兩者交叉點的數字是 " + data[row0][col2] + unit + "。"
                },
                {
                    text: "對照" + title + "，" + col1 + "的總人數共有幾" + unit + "？",
                    correctOption: data["合計"][col1] + unit,
                    wrongOptions: [data["合計"][col0] + unit, data["合計"][col2] + unit, data[row0][col1] + unit],
                    hint: "💡 提示：看表格最下方的對應『" + col1 + "』那一欄的數值。"
                },
                {
                    text: "哪一個" + colType + "的總人數最少？",
                    correctOption: colMin,
                    wrongOptions: dataset.colLabels.filter(c => c !== colMin).concat("都一樣多"),
                    hint: "💡 提示：對照表格下方各" + colType + "合計數值比較大小。"
                },
                {
                    text: "對照" + title + "，" + row1 + "人數合計共有幾" + unit + "？",
                    correctOption: data[row1]["合計"] + unit,
                    wrongOptions: [data[row0]["合計"] + unit, data["合計"]["合計"] + unit, data[row1][col1] + unit],
                    hint: "💡 提示：看表格最右方的『合計』欄中，對應『" + row1 + "』那一列的數值。"
                },
                {
                    text: "對照" + title + "，" + col0 + "和" + col1 + "的" + row1 + "人數哪一個班級比較多？",
                    correctOption: data[row1][col0] > data[row1][col1] ? col0 : (data[row1][col0] < data[row1][col1] ? col1 : "一樣多"),
                    wrongOptions: [col0, col1, "一樣多", "無法比較"].filter(opt => opt !== (data[row1][col0] > data[row1][col1] ? col0 : (data[row1][col0] < data[row1][col1] ? col1 : "一樣多"))),
                    hint: "💡 提示：比較 " + col0 + " " + data[row1][col0] + unit + " 與 " + col1 + " " + data[row1][col1] + unit + " 的大小。"
                },
                {
                    text: "對照" + title + "，" + col2 + "的" + row1 + "和" + row0 + "人數關係是什麼？",
                    correctOption: data[row1][col2] === data[row0][col2] ? "一樣多" : (data[row1][col2] > data[row0][col2] ? (row1 + "比較多") : (row0 + "比較多")),
                    wrongOptions: ["一樣多", row1 + "比較多", row0 + "比較多", "無法比較"].filter(opt => opt !== (data[row1][col2] === data[row0][col2] ? "一樣多" : (data[row1][col2] > data[row0][col2] ? (row1 + "比較多") : (row0 + "比較多")))),
                    hint: "💡 提示：比較 " + col2 + "的 " + row1 + "人數 " + data[row1][col2] + unit + " 與 " + row0 + "人數 " + data[row0][col2] + unit + " 的大小。"
                }
            ];
        }

        function generateLevel3Pool(dataset) {
            const title = dataset.title;
            const rBlank = dataset.blankRow;
            const rOther = dataset.rowLabels.find(r => r !== rBlank);
            const cBlank = dataset.blankCol;

        function DetectiveMathGame() {
            const [gameState, setGameState] = useState('START'); // START, PLAYING, END
            const [level, setLevel] = useState(1);
            const [questions, setQuestions] = useState([]);
            const [qIndex, setQIndex] = useState(0);
            const [score, setScore] = useState(0);
            
            // 學生登入資料
            const [studentClass, setStudentClass] = useState(localStorage.getItem('student_class') || '');

            const [loadingLeaderboard, setLoadingLeaderboard] = useState(false);
            
            // 動態題組狀態
            const [activeL1Dataset, setActiveL1Dataset] = useState(null);
            const [activeL23Dataset, setActiveL23Dataset] = useState(null);
            
            const [questionPotentialScore, setQuestionPotentialScore] = useState(20);
            const [lockedOptions, setLockedOptions] = useState([]);
            const [showHint, setShowHint] = useState(false);
            
            const [feedback, setFeedback] = useState(null); 
            const [currentOptions, setCurrentOptions] = useState([]);
            const [correctIndex, setCorrectIndex] = useState(-1);
            const [selectedOptionIndex, setSelectedOptionIndex] = useState(null);

            const isProcessingRef = useRef(false);

            // 確保有班級座號
            useEffect(() => {
                const storedClass = localStorage.getItem('student_class');
                const storedSeat = localStorage.getItem('student_seat');
                if (!storedClass || !storedSeat) {
                    setShowLoginModal(true);
                }
            }, []);

            const initLevel = (levelNum, l1ds, l23ds) => {
                const QUESTIONS_PER_LEVEL = 4;
                
                // 從 localStorage 讀取已答對題目，防止短時間重複，並依據學生班級座號隔離
                const sClass = localStorage.getItem('student_class') || '';
                const sSeat = localStorage.getItem('student_seat') || '';
                const storageKey = `answered_math_questions_9_${sClass}_${sSeat}`;
                const answeredQuestions = JSON.parse(localStorage.getItem(storageKey) || '[]');
                
                const currentL1ds = l1ds || activeL1Dataset;
                const currentL23ds = l23ds || activeL23Dataset;
                
                let pool = [];
                if (levelNum === 1) {
                    pool = generateLevel1Pool(currentL1ds);
                } else {
                    pool = levelNum === 2 ? generateLevel2Pool(currentL23ds) : generateLevel3Pool(currentL23ds);
                }
                
                let eligiblePool = pool.filter(q => !answeredQuestions.includes(q.text));
                
                // 若庫存不足，重置該關歷史
                if (eligiblePool.length < QUESTIONS_PER_LEVEL) {
                    const poolTexts = pool.map(q => q.text);
                    const updatedAnswers = answeredQuestions.filter(text => !poolTexts.includes(text));
                    localStorage.setItem(storageKey, JSON.stringify(updatedAnswers));
                    eligiblePool = pool;
                }
                
                const selectedQuestions = shuffleArray([...eligiblePool]).slice(0, QUESTIONS_PER_LEVEL);
                setQuestions(selectedQuestions);
                setQIndex(0);
                setupQuestion(selectedQuestions[0]);
            };

            const setupQuestion = (question) => {
                if (!question) return;
                const options = [question.correctOption, ...question.wrongOptions];
                const shuffledOptions = shuffleArray(options);
                setCurrentOptions(shuffledOptions);
                setCorrectIndex(shuffledOptions.indexOf(question.correctOption));
                
                setQuestionPotentialScore(20);
                setLockedOptions([]);
                setShowHint(false);
                setFeedback(null);
                setSelectedOptionIndex(null);
                isProcessingRef.current = false;
            };

            const startGame = () => {
                // 如果沒有班級座號，彈出視窗
                if (!studentClass || !studentSeat) {
                    setShowLoginModal(true);
                    return;
                }
                const l1ds = LEVEL1_DATASETS[Math.floor(Math.random() * LEVEL1_DATASETS.length)];
                const baseL23ds = LEVEL23_DATASETS[Math.floor(Math.random() * LEVEL23_DATASETS.length)];
                const l23ds = getRandomizedDataset(baseL23ds);
                setActiveL1Dataset(l1ds);
                setActiveL23Dataset(l23ds);
                setGameState('PLAYING');
                setScore(0);
                setLevel(1);
                initLevel(1, l1ds, l23ds);
            };

            const handleShowHint = () => {
                setShowHint(true);
                setQuestionPotentialScore(prev => Math.min(prev, 10));
            };

            const handleAnswer = (index) => {
                if (isProcessingRef.current || feedback === 'correct' || lockedOptions.includes(index)) return;

                setSelectedOptionIndex(index);

                if (index === correctIndex) {
                    isProcessingRef.current = true;
                    setFeedback('correct');
                    const pts = questionPotentialScore;
                    const newScore = score + pts;
                    setScore(prev => prev + pts);
                    
                    // 記憶已答對的題目，依據學生座號隔離
                    const sClass = localStorage.getItem('student_class') || '';
                    const sSeat = localStorage.getItem('student_seat') || '';
                    const storageKey = `answered_math_questions_9_${sClass}_${sSeat}`;
                    const answered = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    const qText = questions[qIndex]?.text;
                    if (qText && !answered.includes(qText)) {
                        answered.push(qText);
                        localStorage.setItem(storageKey, JSON.stringify(answered));
                    }

                    setTimeout(() => nextQuestion(newScore), 1500);
                } else {
                    isProcessingRef.current = true;
                    setFeedback('incorrect');
                    setLockedOptions(prev => [...prev, index]);
                    
                    let newPotentialScore = questionPotentialScore - 5;
                    if (!showHint) {
                        setShowHint(true);
                        newPotentialScore = Math.min(newPotentialScore, 10);
                    }
                    setQuestionPotentialScore(Math.max(0, newPotentialScore));

                    setTimeout(() => {
                        setFeedback(null);
                        setSelectedOptionIndex(null);
                        isProcessingRef.current = false;
                    }, 800);
                }
            };

            const nextQuestion = (currentScore) => {
                if (qIndex + 1 < questions.length) {
                    const nextIdx = qIndex + 1;
                    setQIndex(nextIdx);
                    setupQuestion(questions[nextIdx]);
                } else {
                    if (level < 3) {
                        const nextLevel = level + 1;
                        setLevel(nextLevel);
                        initLevel(nextLevel, activeL1Dataset, activeL23Dataset);
                    } else {
                        setGameState('END');
                        submitScoreAndFetchLeaderboard(currentScore);
                    }
                }
            };

            // 上傳分數並查詢排行榜
            const submitScoreAndFetchLeaderboard = async (finalScore) => {
                if (!db) return;
                setLoadingLeaderboard(true);
                
                const payload = {
                    class: studentClass.trim(),
                    seat: studentSeat.trim(),
                    score: finalScore,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    // 1. 上傳成績
                    await db.collection("math_game_scores_9").add(payload);
                    
                    // 2. 獲取前 50 筆做為排行篩選
                    const snapshot = await db.collection("math_game_scores_9")
                        .orderBy("score", "desc")
                        .limit(50)
                        .get();
                        
                    const list = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        list.push({
                            class: data.class,
                            seat: data.seat,
                            score: data.score,
                            timestamp: data.timestamp ? data.timestamp.toDate() : new Date()
                        });
                    });

                    // 3. 在 JS 中進行二次排序 (時間做為 tie-breaker：時間越早越前面)
                    list.sort((a, b) => {
                        if (b.score !== a.score) {
                            return b.score - a.score;
                        }
                        return a.timestamp - b.timestamp;
                    });

                    setLeaderboard(list.slice(0, 20));
                } catch (err) {
                    console.error("Firebase submit/query failed:", err);
                } finally {
                    setLoadingLeaderboard(false);
                }
            };

                        <table className="w-full text-center border-collapse text-xs md:text-base min-w-[280px]">
                            <thead>
                                <tr className="bg-slate-950 text-cyan-400 border-b border-cyan-500/30">
                                    <th className="p-2 font-extrabold border-r border-cyan-500/30">{dataset.rowType} / {dataset.colType}</th>
                                    {cols.map((col, idx) => (
                                        <th key={idx} className="p-2 font-extrabold border-r border-cyan-500/10">{col}</th>
                                    ))}
                                    <th className="p-2 font-extrabold">合計({unit})</th>
                                </tr>
                            </thead>
                            <tbody className="bg-slate-900/60 font-mono text-slate-200">
                                {rows.map((row, rIdx) => (
                                    <tr key={rIdx} className="border-b border-cyan-500/10 hover:bg-cyan-950/20 transition-colors">
                                        <td className="p-2 font-bold bg-slate-950 text-cyan-400 border-r border-cyan-500/30">{row}</td>
                                        {cols.map((col, cIdx) => {
                                            const val = data[row][col];
                                            const isBlank = isL3 && (row === dataset.blankRow && col === dataset.blankCol);
                                            return (
                                                <td key={cIdx} className={`p-2 border-r border-cyan-500/10 ${isBlank ? 'text-cyan-300 font-bold bg-cyan-950/30' : ''}`}>
                                                    {isBlank ? '( 　 )' : val}
                                                </td>
                                            );
                                        })}
                                        <td className="p-2">{data[row]["合計"]}</td>
                                    </tr>
                                ))}
                                <tr className="font-extrabold bg-slate-950/40 hover:bg-cyan-950/20 transition-colors">
                                    <td className="p-2 bg-slate-950 text-cyan-400 border-r border-cyan-500/30">合計({unit})</td>
                                    {cols.map((col, cIdx) => {
                                        const val = data["合計"][col];
                                        const isBlank = isL3 && ("合計" === dataset.blankSumRow && col === dataset.blankSumCol);
                                        return (
                                            <td key={cIdx} className={`p-2 border-r border-cyan-500/10 ${isBlank ? 'text-cyan-300 bg-cyan-950/30' : ''}`}>
                                                {isBlank ? '( 　 )' : val}
                                            </td>
                                        );
                                    })}
                                    <td className="p-2">{data["合計"]["合計"]}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                );
            };

            const renderStartScreen = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] text-center animate-pop-in space-y-6 px-4">
                    <div className="relative">
                        <div className="w-24 h-24 md:w-32 md:h-32 bg-cyan-500/10 border border-cyan-400/40 rounded-full flex items-center justify-center animate-float">
                            <Icon name="spyglass" className="w-12 h-12 md:w-16 md:h-16 text-cyan-400" />
                        </div>
                        <div className="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full animate-ping"></div>
                        <div className="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full"></div>
                    </div>
                    
                    <div className="space-y-2">
                        <h1 className="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-cyan-500 tracking-widest drop-shadow-md leading-tight">
                            數據偵探的統計解密
                        </h1>
                        <p className="text-cyan-500 text-xs md:text-sm tracking-widest font-mono">
                            CASE FILE: UNIT-09 / STATISTICAL_TABLES
                        </p>
                    </div>

                    {studentClass && studentSeat && (
                        <div className="text-sm text-cyan-300/80 font-mono bg-cyan-950/30 border border-cyan-800/40 px-4 py-2 rounded-full">
                            🕵️ 偵探代號：{studentClass} 班 {studentSeat} 號
                            <button onClick={() => setShowLoginModal(true)} className="ml-3 underline text-cyan-400 hover:text-cyan-200">修改</button>
                        </div>
                    )}
                    
                    <div className="bg-slate-950/80 p-5 md:p-6 rounded-2xl text-left text-sm md:text-base text-slate-300 w-full max-w-md border border-cyan-500/20 shadow-[0_0_25px_rgba(6,182,212,0.05)]">
                        <h3 className="font-bold text-white flex items-center gap-2 mb-3 border-b border-slate-800 pb-2">
                            <Icon name="folder" className="w-5 h-5 text-cyan-400" />
                            案件調查計分規則
                        </h3>
                        <ul className="space-y-3 font-medium">
                            <li className="flex items-start gap-2">
                                <Icon name="check" className="w-5 h-5 text-emerald-400 shrink-0 mt-0.5" />
                                <span><strong className="text-emerald-300">首發破案 (一次選對)：</strong>獲得完美 20 點積分。</span>
                            </li>
                            <li className="flex items-start gap-2">
                                <Icon name="help" className="w-5 h-5 text-cyan-400 shrink-0 mt-0.5" />
                                <span><strong className="text-cyan-300">使用偵查提示：</strong>積分上限鎖定為 10 點。</span>
                            </li>
                            <li className="flex items-start gap-2">
                                <Icon name="x" className="w-5 h-5 text-amber-500 shrink-0 mt-0.5" />
                                <span><strong className="text-amber-400">調查失誤 (點選錯誤)：</strong>一次扣 5 分，並<strong className="text-amber-400">強制開啟線索</strong>！瞎猜無法獲得高分。</span>
                            </li>
                        </ul>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-4 w-full max-w-xs">
                        <button onClick={startGame} className="w-full py-4 bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 text-lg md:text-xl font-black rounded-2xl shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                            <Icon name="spyglass" className="w-5 h-5" />
                            開始調查
                        </button>
                        <a href="../index.html" className="w-full py-4 bg-slate-800 hover:bg-slate-700 text-cyan-400 text-lg md:text-xl font-bold rounded-2xl transition-all border border-cyan-800/40 flex items-center justify-center gap-2">
                            <Icon name="home" className="w-5 h-5" />
                            返回大廳
                        </a>
                    </div>

                    {localStorage.getItem(`answered_math_questions_9_${studentClass}_${studentSeat}`) && (
                        <button onClick={() => {
                            if(confirm("確定要清除所有答對的歷史紀錄，重新開始嗎？")) {
                                localStorage.removeItem(`answered_math_questions_9_${studentClass}_${studentSeat}`);
                                alert("已重置學習進度！");
                                window.location.reload();
                            }
                        }} className="text-xs text-slate-500 hover:text-slate-400 underline mt-2 transition-colors touch-manipulation">
                            重置學習進度 (清除已答對紀錄)
                        </button>
                    )}
                </div>
            );

            const renderPlayingScreen = () => {
                if (!questions || questions.length === 0 || qIndex >= questions.length) return null;
                const currentLevelData = LEVEL_HEADERS[level];
                const currentQuestion = questions[qIndex];
                if (!currentQuestion) return null;

                return (
                    <div className="flex flex-col w-full max-w-3xl mx-auto animate-pop-in px-2 md:px-6">
                        {/* 關卡資訊與得分 */}
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 md:mb-6 bg-slate-950/80 p-4 md:p-5 rounded-2xl border border-cyan-500/20 shadow-lg gap-4">
                            <div>
                                <div className="text-[10px] md:text-xs text-cyan-400 font-bold uppercase tracking-wider mb-1 font-mono">{currentLevelData.subtitle}</div>
                                <div className="text-lg md:text-xl font-extrabold text-white flex items-center gap-2">
                                    <Icon name="badge" className="w-5 h-5 text-cyan-400 shrink-0" />
                                    {currentLevelData.title}
                                </div>
                            </div>
                            <div className="flex items-center gap-6 w-full md:w-auto justify-between md:justify-end">
                                <div className="text-left md:text-right font-mono">
                                    <div className="text-[10px] md:text-xs text-slate-500">積分 SCORE</div>
                                    <div className="text-xl md:text-2xl font-black text-amber-400">{score}</div>
                                </div>
                                <div className="text-right font-mono">
                                    <div className="text-[10px] md:text-xs text-slate-500">進度 PROGRESS</div>
                                    <div className="text-base md:text-lg font-bold text-white bg-slate-800 px-3 py-1 rounded-full whitespace-nowrap border border-cyan-900">
                                        {qIndex + 1} / {questions.length}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 主問答面板 */}
                        <div className="bg-slate-950/80 rounded-3xl p-5 md:p-8 shadow-2xl border border-slate-800 relative overflow-hidden flex flex-col">
                            {/* 背景雷達掃描線動畫效果 */}
                            <div className="absolute inset-0 bg-gradient-to-b from-transparent via-cyan-500/5 to-transparent h-1/2 w-full animate-scan pointer-events-none"></div>
                            
                            <div className="self-end bg-slate-900 border border-cyan-900 px-4 py-2 rounded-full mb-4 flex items-center gap-2 z-10 font-mono text-sm">
                                <span className="text-slate-400">本案偵破分數:</span>
                                <span key={questionPotentialScore} className="text-lg font-bold text-emerald-400 animate-pulse">
                                    +{questionPotentialScore}
                                </span>
                            </div>

                            {/* 根據關卡動態加載對應的統計表 */}
                            {level === 1 ? renderOneDTable(activeL1Dataset) : renderTwoDTable(activeL23Dataset, level === 3)}

                            <h2 className="text-xl md:text-2xl font-bold text-white leading-relaxed relative z-10 mb-6 md:mb-10 break-words min-h-[60px] border-l-4 border-cyan-500 pl-3">
                                {currentQuestion.text}
                            </h2>

                            {/* 選項區 */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 relative z-10">
                                {currentOptions.map((option, index) => {
                                    const isLocked = lockedOptions.includes(index);
                                    let buttonStyle = "bg-slate-900/90 hover:bg-slate-800 border-slate-700 text-slate-200 active:scale-[0.98] hover:border-cyan-500/50";
                                    
                                    if (isLocked) {
                                        buttonStyle = "bg-slate-950 border-slate-900 text-slate-600 opacity-40 cursor-not-allowed";
                                    } else if (selectedOptionIndex === index) {
                                        if (feedback === 'correct') {
                                            buttonStyle = "bg-emerald-600 border-emerald-400 text-white shadow-[0_0_15px_rgba(16,185,129,0.5)] z-20 scale-102";
                                        } else if (feedback === 'incorrect') {
                                            buttonStyle = "bg-red-700 border-red-500 text-white animate-shake";
                                        }
                                    } else if (feedback === 'correct') {
                                        buttonStyle = "bg-slate-950 border-slate-900 text-slate-600 opacity-40 cursor-not-allowed";
                                    }

                                    return (
                                        <button
                                            key={index}
                                            onClick={() => handleAnswer(index)}
                                            disabled={feedback === 'correct' || isLocked}
                                            className={`relative min-h-[58px] md:min-h-[70px] p-4 rounded-xl border text-base md:text-lg font-extrabold transition-all flex items-center justify-center gap-3 touch-manipulation select-none ${buttonStyle}`}
                                        >
                                            <span className={`${isLocked ? 'line-through decoration-red-500/50' : ''}`}>
                                                {option}
                                            </span>
                                            {selectedOptionIndex === index && feedback === 'correct' && <Icon name="check" className="w-5 h-5 text-white absolute right-4" />}
                                            {isLocked && <Icon name="x" className="w-5 h-5 text-red-500/40 absolute right-4" />}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* 提示區 */}
                            <div className="mt-8 flex flex-col items-center relative z-10 min-h-[80px]">
                                {!showHint ? (
                                    <button onClick={handleShowHint} className="flex items-center gap-2 text-cyan-400 hover:text-cyan-200 bg-cyan-950/40 hover:bg-cyan-900/50 px-5 py-3 rounded-full transition-colors text-sm border border-cyan-800/40 touch-manipulation">
                                        <Icon name="help" className="w-4 h-4" />
                                        請求線索支援 (分數上限降為 10 分)
                                    </button>
                                ) : (
                                    <div className="bg-cyan-950/60 border border-cyan-500/30 text-cyan-100 p-4 md:p-5 rounded-2xl text-sm md:text-base animate-pop-in flex items-start gap-3 w-full shadow-inner">
                                        <div className="text-2xl shrink-0">🕵️‍♂️</div>
                                        <div className="leading-relaxed">
                                            <span className="text-amber-400 font-bold block mb-1">【偵探情報線索】</span>
                                            {currentQuestion.hint}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderEndScreen = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] text-center animate-pop-in space-y-6 px-4 py-6">
                    <div className="relative">
                        <div className="w-24 h-24 bg-amber-500/10 border-2 border-amber-400/50 rounded-full flex items-center justify-center animate-float shadow-[0_0_20px_rgba(245,158,11,0.2)]">
                            <Icon name="star" className="w-12 h-12 text-amber-400" />
                        </div>
                        <Icon name="check" className="w-6 h-6 text-emerald-400 absolute bottom-0 right-0 bg-slate-900 border border-slate-800 rounded-full p-1" />
                    </div>
                    
                    <div className="space-y-1">
                        <h1 className="text-3xl md:text-5xl font-black text-white tracking-wider">
                            案情水落石出！
                        </h1>
                        <p className="text-slate-400 text-xs md:text-sm font-mono">CASE REPORT: STATUS_RESOLVED</p>
                    </div>
                    
                    <div className="bg-slate-950/90 p-6 rounded-2xl border border-cyan-500/20 mt-4 w-full max-w-sm shadow-[0_0_30px_rgba(6,182,212,0.1)] relative overflow-hidden">
                        <div className="text-slate-500 text-xs md:text-sm uppercase tracking-widest mb-1 font-mono">案件破譯總積分</div>
                        <div className="text-5xl md:text-6xl font-black text-amber-400 font-mono">{score}</div>
                        <div className="text-slate-500 text-xs mt-3">滿分 240 分</div>
                        <div className="text-[10px] text-cyan-400/80 font-mono mt-1 bg-cyan-950/30 py-1 px-3 rounded-full inline-block">
                            登記者：{studentClass} 班 {studentSeat} 號
                        </div>
                    </div>

                    {/* Firestore 即時排行榜 */}
                    <div className="bg-slate-950/80 p-5 rounded-2xl border border-slate-800 w-full max-w-md">
                        <h3 className="font-bold text-white flex items-center gap-2 mb-3 border-b border-slate-800 pb-2 text-sm md:text-base">
                            <Icon name="badge" className="w-4 h-4 text-amber-400" />
                            【即時排行榜】🔍 數據偵探
                        </h3>
                        
                        {loadingLeaderboard ? (
                            <div className="text-slate-400 text-sm py-8 font-mono animate-pulse">正在調取現場數據...</div>
                        ) : leaderboard.length > 0 ? (
                            <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                                {leaderboard.map((item, idx) => (
                                    <div key={idx} className={`flex justify-between items-center p-2 rounded text-xs md:text-sm font-mono ${item.class === studentClass && item.seat === studentSeat ? 'bg-cyan-950/40 border border-cyan-500/30' : 'bg-slate-900/50'}`}>
                                        <div className="flex items-center gap-3">
                                            <span className={`w-5 h-5 flex items-center justify-center rounded-full text-[10px] font-bold ${idx === 0 ? 'bg-amber-400 text-slate-950' : idx === 1 ? 'bg-slate-300 text-slate-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                                {idx + 1}
                                            </span>
                                            <span className="text-slate-200">{item.class} 班 {item.seat} 號</span>
                                        </div>
                                        <span className="text-amber-400 font-bold">{item.score} 分</span>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-slate-500 text-xs py-8">尚無調查數據，你是第一位挑戰者！</div>
                        )}
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onClick={startGame} className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-slate-950 text-base md:text-lg font-extrabold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg">
                            <Icon name="refresh" className="w-4 h-4" />
                            重新調查
                        </button>
                        <a href="../index.html" className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-cyan-400 text-base md:text-lg font-bold rounded-xl transition-all border border-cyan-800/40 flex items-center justify-center gap-2">
                            <Icon name="home" className="w-4 h-4" />
                            返回大廳
                        </a>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-900 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-zinc-950 to-slate-900 flex items-center justify-center py-8 px-4">
                    <div className="w-full max-w-4xl">
                        {gameState === 'START' && renderStartScreen()}
                        {gameState === 'PLAYING' && renderPlayingScreen()}
                        {gameState === 'END' && renderEndScreen()}
                    </div>

                    {/* 班級座號登入浮窗 */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <form onSubmit={handleSaveLogin} className="bg-slate-900 border border-cyan-500/30 p-6 md:p-8 rounded-3xl max-w-sm w-full space-y-6 shadow-[0_0_40px_rgba(6,182,212,0.2)] animate-pop-in">
                                <div className="text-center space-y-2">
                                    <div className="w-12 h-12 bg-cyan-500/10 border border-cyan-400/40 rounded-full flex items-center justify-center mx-auto text-cyan-400">
                                        🕵️
                                    </div>
                                    <h3 className="text-xl font-bold text-white">請登記偵探身份</h3>
                                    <p className="text-slate-400 text-xs font-mono">登記後成績將自動上傳即時排行榜</p>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-mono text-cyan-400 uppercase tracking-widest mb-1.5">班級 (Class)</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={studentClass} 
                                            onChange={(e) => setStudentClass(e.target.value)}
                                            placeholder="例如：305" 
                                            className="w-full bg-slate-950 border border-slate-700 focus:border-cyan-500 rounded-xl px-4 py-3 text-white outline-none transition-colors text-sm font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-mono text-cyan-400 uppercase tracking-widest mb-1.5">座號 (Seat No.)</label>
                                        <input 
                                            type="number" 
                                            required
                                            min="1"
                                            max="100"
                                            value={studentSeat} 
                                            onChange={(e) => setStudentSeat(e.target.value)}
                                            placeholder="例如：12" 
                                            className="w-full bg-slate-950 border border-slate-700 focus:border-cyan-500 rounded-xl px-4 py-3 text-white outline-none transition-colors text-sm font-mono"
                                        />
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    className="w-full py-3 bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 font-black rounded-xl shadow-lg transition-all"
                                >
                                    完成登記，進入調查
                                </button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DetectiveMathGame />);
    </script>
</body>
</html>
