    <style>
        @keyframes snowfall {
            0% { transform: translateY(-10vh) translateX(0px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(100vh) translateX(20px); opacity: 0; }
        }
        .snow-particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: snowfall linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in { animation: popIn 0.3s ease-out forwards; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>

                'alert': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
                'check': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>,
                'help': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>,
                'x': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
                'star': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
                'refresh': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>,
                'badge': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
                'home': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            };
            return icons[name] || null;
        };

        function DecimalMathGame() {
            const [gameState, setGameState] = useState('START'); // START, PLAYING, END
            const [level, setLevel] = useState(1);
            const [questions, setQuestions] = useState([]);
            const [qIndex, setQIndex] = useState(0);
            const [score, setScore] = useState(0);
            
            // 學生登入資料
            const [studentClass, setStudentClass] = useState(localStorage.getItem('student_class') || '');
            const [studentSeat, setStudentSeat] = useState(localStorage.getItem('student_seat') || '');
            const [showLoginModal, setShowLoginModal] = useState(false);

            // 排行榜資料
            const [leaderboard, setLeaderboard] = useState([]);
            const [loadingLeaderboard, setLoadingLeaderboard] = useState(false);
            
            const [questionPotentialScore, setQuestionPotentialScore] = useState(20);
            const [lockedOptions, setLockedOptions] = useState([]);
            const [showHint, setShowHint] = useState(false);
            
            const [feedback, setFeedback] = useState(null); 
            const [currentOptions, setCurrentOptions] = useState([]);
            const [correctIndex, setCorrectIndex] = useState(-1);
            const [selectedOptionIndex, setSelectedOptionIndex] = useState(null);

            const isProcessingRef = useRef(false);

            // 確保有班級座號
            useEffect(() => {
                const storedClass = localStorage.getItem('student_class');
                const storedSeat = localStorage.getItem('student_seat');
                if (!storedClass || !storedSeat) {
                    setShowLoginModal(true);
                }
            }, []);

            const initLevel = useCallback((levelNum) => {
                const QUESTIONS_PER_LEVEL = 4;
                
                // 從 localStorage 讀取已答對題目，防止短時間重複，並依據學生班級座號隔離
                const sClass = localStorage.getItem('student_class') || '';
                const sSeat = localStorage.getItem('student_seat') || '';
                const storageKey = `answered_math_questions_5_${sClass}_${sSeat}`;
                const answeredQuestions = JSON.parse(localStorage.getItem(storageKey) || '[]');
                
                let eligiblePool = GAME_DATA[levelNum].pool.filter(q => !answeredQuestions.includes(q.text));
                
                // 若庫存不足，重置該關歷史
                if (eligiblePool.length < QUESTIONS_PER_LEVEL) {
                    const poolTexts = GAME_DATA[levelNum].pool.map(q => q.text);
                    const updatedAnswers = answeredQuestions.filter(text => !poolTexts.includes(text));
                    localStorage.setItem(storageKey, JSON.stringify(updatedAnswers));
                    eligiblePool = GAME_DATA[levelNum].pool;
                }
                
                const selectedQuestions = shuffleArray([...eligiblePool]).slice(0, QUESTIONS_PER_LEVEL);
                setQuestions(selectedQuestions);
                setQIndex(0);
                setupQuestion(selectedQuestions[0]);
            }, []);

            const setupQuestion = (question) => {
                if (!question) return;
                const options = [question.correctOption, ...question.wrongOptions];
                const shuffledOptions = shuffleArray(options);
                setCurrentOptions(shuffledOptions);
                setCorrectIndex(shuffledOptions.indexOf(question.correctOption));
                
                setQuestionPotentialScore(20);
                setLockedOptions([]);
                setShowHint(false);
                setFeedback(null);
                setSelectedOptionIndex(null);
                isProcessingRef.current = false;
            };

            const startGame = () => {
                if (!studentClass || !studentSeat) {
                    setShowLoginModal(true);
                    return;
                }
                setGameState('PLAYING');
                setScore(0);
                setLevel(1);
                initLevel(1);
            };

            const handleShowHint = () => {
                setShowHint(true);
                setQuestionPotentialScore(prev => Math.min(prev, 10));
            };

            const handleAnswer = (index) => {
                if (isProcessingRef.current || feedback === 'correct' || lockedOptions.includes(index)) return;

                setSelectedOptionIndex(index);

                if (index === correctIndex) {
                    isProcessingRef.current = true;
                    setFeedback('correct');
                    const pts = questionPotentialScore;
                    const newScore = score + pts;
                    setScore(prev => prev + pts);
                    
                    // 記憶已答對的題目，依據學生座號隔離
                    const sClass = localStorage.getItem('student_class') || '';
                    const sSeat = localStorage.getItem('student_seat') || '';
                    const storageKey = `answered_math_questions_5_${sClass}_${sSeat}`;
                    const answered = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    const qText = questions[qIndex]?.text;
                    if (qText && !answered.includes(qText)) {
                        answered.push(qText);
                        localStorage.setItem(storageKey, JSON.stringify(answered));
                    }

                    setTimeout(() => nextQuestion(newScore), 1500);
                } else {
                    isProcessingRef.current = true;
                    setFeedback('incorrect');
                    setLockedOptions(prev => [...prev, index]);
                    
                    let newPotentialScore = questionPotentialScore - 5;
                    if (!showHint) {
                        setShowHint(true);
                        newPotentialScore = Math.min(newPotentialScore, 10);
                    }
                    setQuestionPotentialScore(Math.max(0, newPotentialScore));

                    setTimeout(() => {
                        setFeedback(null);
                        setSelectedOptionIndex(null);
                        isProcessingRef.current = false;
                    }, 800);
                }
            };

            const nextQuestion = (currentScore) => {
                if (qIndex + 1 < questions.length) {
                    const nextIdx = qIndex + 1;
                    setQIndex(nextIdx);
                    setupQuestion(questions[nextIdx]);
                } else {
                    if (level < 3) {
                        const nextLevel = level + 1;
                        setLevel(nextLevel);
                        initLevel(nextLevel);
                    } else {
                        setGameState('END');
                        submitScoreAndFetchLeaderboard(currentScore);
                    }
                }
            };

            // 上傳分數並查詢排行榜
            const submitScoreAndFetchLeaderboard = async (finalScore) => {
                if (!db) return;
                setLoadingLeaderboard(true);
                
                const payload = {
                    class: studentClass.trim(),
                    seat: studentSeat.trim(),
                    score: finalScore,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    await db.collection("math_game_scores_5").add(payload);
                    const snapshot = await db.collection("math_game_scores_5")
                        .orderBy("score", "desc")
                        .limit(50)
                        .get();
                        
                    const list = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        list.push({
                            class: data.class,
                            seat: data.seat,
                            score: data.score,
                            timestamp: data.timestamp ? data.timestamp.toDate() : new Date()
                        });
                    });

                    // 排序
                    list.sort((a, b) => {
                        if (b.score !== a.score) {
                            return b.score - a.score;
                        }
                        return a.timestamp - b.timestamp;
                    });

                    setLeaderboard(list.slice(0, 20));
                } catch (err) {
                    console.error("Firebase submit/query failed:", err);
                } finally {
                    setLoadingLeaderboard(false);
                }
            };

            const handleSaveLogin = (e) => {
                e.preventDefault();
                if (studentClass.trim() && studentSeat.trim()) {
                    localStorage.setItem('student_class', studentClass.trim());
                    localStorage.setItem('student_seat', studentSeat.trim());
                    setShowLoginModal(false);
                }
            };

            const renderStartScreen = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] text-center animate-pop-in space-y-6 px-4">
                    <div className="relative">
                        <div className="w-24 h-24 md:w-32 md:h-32 bg-sky-500/10 border border-sky-400/40 rounded-full flex items-center justify-center animate-float">
                            <Icon name="snowflake" className="w-12 h-12 md:w-16 md:h-16 text-sky-400 animate-spin" style={{ animationDuration: '20s' }} />
                        </div>
                        <div className="absolute top-0 right-0 w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
                    </div>
                    
                    <div className="space-y-2">
                        <h1 className="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-teal-300 to-blue-500 tracking-widest drop-shadow-md leading-tight">
                            冰河大冒險
                        </h1>
                        <p className="text-sky-400 text-xs md:text-sm tracking-widest font-mono">
                            MISSION FILE: UNIT-05 / DECIMALS
                        </p>
                    </div>

                    {studentClass && studentSeat && (
                        <div className="text-sm text-sky-300/80 font-mono bg-sky-950/30 border border-sky-800/40 px-4 py-2 rounded-full">
                            ❄️ 護衛隊代號：{studentClass} 班 {studentSeat} 號
                            <button onClick={() => setShowLoginModal(true)} className="ml-3 underline text-sky-400 hover:text-sky-200">修改</button>
                        </div>
                    )}
                    
                    <div className="bg-slate-900/80 p-5 md:p-6 rounded-2xl text-left text-sm md:text-base text-slate-300 w-full max-w-md border border-sky-500/20 shadow-lg">
                        <h3 className="font-bold text-white flex items-center gap-2 mb-3 border-b border-slate-800 pb-2">
                            <Icon name="badge" className="w-5 h-5 text-sky-400" />
                            冰川護航計分法
                        </h3>
                        <ul className="space-y-3 font-medium">
                            <li className="flex items-start gap-2">
                                <Icon name="check" className="w-5 h-5 text-emerald-400 shrink-0 mt-0.5" />
                                <span><strong className="text-emerald-300">完美救援 (一次選對)：</strong>獲得完美 20 點積分。</span>
                            </li>
                            <li className="flex items-start gap-2">
                                <Icon name="help" className="w-5 h-5 text-sky-400 shrink-0 mt-0.5" />
                                <span><strong className="text-sky-300">呼叫破冰提示：</strong>積分上限鎖定為 10 點。</span>
                            </li>
                            <li className="flex items-start gap-2">
                                <Icon name="x" className="w-5 h-5 text-amber-500 shrink-0 mt-0.5" />
                                <span><strong className="text-amber-400">系統失準 (點選錯誤)：</strong>一次扣 5 分，並<strong className="text-amber-400">強制開啟線索</strong>！</span>
                            </li>
                        </ul>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-4 w-full max-w-xs">
                        <button onClick={startGame} className="w-full py-4 bg-gradient-to-r from-sky-500 to-blue-500 hover:from-sky-400 hover:to-blue-400 text-slate-950 text-lg md:text-xl font-black rounded-2xl shadow-[0_0_20px_rgba(14,165,233,0.4)] transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                            <Icon name="snowflake" className="w-5 h-5" />
                            接受挑戰
                        </button>
                        <a href="../index.html" className="w-full py-4 bg-slate-900 hover:bg-slate-800 text-sky-400 text-lg md:text-xl font-bold rounded-2xl transition-all border border-sky-800/40 flex items-center justify-center gap-2">
                            <Icon name="home" className="w-5 h-5" />
                            返回大廳
                        </a>
                    </div>

                    {localStorage.getItem(`answered_math_questions_5_${studentClass}_${studentSeat}`) && (
                        <button onClick={() => {
                            if(confirm("確定要清除所有答對的歷史紀錄，重新開始嗎？")) {
                                localStorage.removeItem(`answered_math_questions_5_${studentClass}_${studentSeat}`);
                                alert("已重置學習進度！");
                                window.location.reload();
                            }
                        }} className="text-xs text-slate-500 hover:text-slate-400 underline mt-2 transition-colors touch-manipulation">
                            重置學習進度 (清除已答對紀錄)
                        </button>
                    )}
                </div>
            );

            const renderPlayingScreen = () => {
                if (!questions || questions.length === 0) return null;
                const currentLevelData = GAME_DATA[level];
                const currentQuestion = questions[qIndex];

                return (
                    <div className="flex flex-col w-full max-w-3xl mx-auto animate-pop-in px-2 md:px-6">
                        {/* 關卡資訊與得分 */}
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 md:mb-6 bg-slate-900/80 p-4 md:p-5 rounded-2xl border border-sky-500/20 shadow-lg gap-4">
                            <div>
                                <div className="text-[10px] md:text-xs text-sky-400 font-bold uppercase tracking-wider mb-1 font-mono">{currentLevelData.subtitle}</div>
                                <div className="text-lg md:text-xl font-extrabold text-white flex items-center gap-2">
                                    <Icon name="badge" className="w-5 h-5 text-sky-400 shrink-0" />
                                    {currentLevelData.title}
                                </div>
                            </div>
                            <div className="flex items-center gap-6 w-full md:w-auto justify-between md:justify-end">
                                <div className="text-left md:text-right font-mono">
                                    <div className="text-[10px] md:text-xs text-slate-500">積分 SCORE</div>
                                    <div className="text-xl md:text-2xl font-black text-amber-400">{score}</div>
                                </div>
                                <div className="text-right font-mono">
                                    <div className="text-[10px] md:text-xs text-slate-500">進度 PROGRESS</div>
                                    <div className="text-base md:text-lg font-bold text-white bg-slate-800 px-3 py-1 rounded-full whitespace-nowrap border border-sky-900">
                                        {qIndex + 1} / {questions.length}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 主問答面板 */}
                        <div className="bg-slate-900/80 rounded-3xl p-5 md:p-8 shadow-2xl border border-slate-800 relative overflow-hidden flex flex-col">
                            <div className="self-end bg-slate-950 border border-sky-900 px-4 py-2 rounded-full mb-4 flex items-center gap-2 z-10 font-mono text-sm">
                                <span className="text-slate-400">本題挑戰分數:</span>
                                <span key={questionPotentialScore} className="text-lg font-bold text-emerald-400 animate-pulse">
                                    +{questionPotentialScore}
                                </span>
                            </div>

                            <h2 className="text-xl md:text-3xl font-bold text-white leading-relaxed relative z-10 mb-6 md:mb-10 break-words min-h-[60px] border-l-4 border-sky-500 pl-3">
                                {currentQuestion.text}
                            </h2>

                            {/* 選項區 */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 relative z-10">
                                {currentOptions.map((option, index) => {
                                    const isLocked = lockedOptions.includes(index);
                                    let buttonStyle = "bg-slate-950/90 hover:bg-slate-800 border-slate-700 text-slate-200 active:scale-[0.98] hover:border-sky-500/50";
                                    
                                    if (isLocked) {
                                        buttonStyle = "bg-slate-950 border-slate-900 text-slate-600 opacity-40 cursor-not-allowed";
                                    } else if (selectedOptionIndex === index) {
                                        if (feedback === 'correct') {
                                            buttonStyle = "bg-emerald-600 border-emerald-400 text-white shadow-[0_0_15px_rgba(16,185,129,0.5)] z-20 scale-102";
                                        } else if (feedback === 'incorrect') {
                                            buttonStyle = "bg-red-700 border-red-500 text-white animate-shake";
                                        }
                                    } else if (feedback === 'correct') {
                                        buttonStyle = "bg-slate-950 border-slate-900 text-slate-600 opacity-40 cursor-not-allowed";
                                    }

                                    return (
                                        <button
                                            key={index}
                                            onClick={() => handleAnswer(index)}
                                            disabled={feedback === 'correct' || isLocked}
                                            className={`relative min-h-[58px] md:min-h-[70px] p-4 rounded-xl border text-base md:text-xl font-extrabold transition-all flex items-center justify-center gap-3 touch-manipulation select-none ${buttonStyle}`}
                                        >
                                            <span className={`${isLocked ? 'line-through decoration-red-500/50' : ''}`}>
                                                {option}
                                            </span>
                                            {selectedOptionIndex === index && feedback === 'correct' && <Icon name="check" className="w-5 h-5 text-white absolute right-4" />}
                                            {isLocked && <Icon name="x" className="w-5 h-5 text-red-500/40 absolute right-4" />}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* 提示區 */}
                            <div className="mt-8 flex flex-col items-center relative z-10 min-h-[80px]">
                                {!showHint ? (
                                    <button onClick={handleShowHint} className="flex items-center gap-2 text-sky-400 hover:text-sky-200 bg-sky-950/40 hover:bg-sky-900/50 px-5 py-3 rounded-full transition-colors text-sm border border-sky-800/40 touch-manipulation">
                                        <Icon name="help" className="w-4 h-4" />
                                        請求破冰線索 (分數上限降為 10 分)
                                    </button>
                               ) : (
                                    <div className="bg-sky-950/60 border border-sky-500/30 text-sky-100 p-4 md:p-5 rounded-2xl text-sm md:text-base animate-pop-in flex items-start gap-3 w-full shadow-inner">
                                        <div className="text-2xl shrink-0">🤖</div>
                                        <div className="leading-relaxed">
                                            <span className="text-amber-400 font-bold block mb-1">【除雪破冰提示】</span>
                                            {currentQuestion.hint}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderEndScreen = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] text-center animate-pop-in space-y-6 px-4 py-6">
                    <div className="relative">
                        <div className="w-24 h-24 bg-amber-500/10 border-2 border-amber-400/50 rounded-full flex items-center justify-center animate-float shadow-[0_0_20px_rgba(245,158,11,0.2)]">
                            <Icon name="star" className="w-12 h-12 text-amber-400" />
                        </div>
                        <Icon name="check" className="w-6 h-6 text-emerald-400 absolute bottom-0 right-0 bg-slate-900 border border-slate-800 rounded-full p-1" />
                    </div>
                    
                    <div className="space-y-1">
                        <h1 className="text-3xl md:text-5xl font-black text-white tracking-wider">
                            成功抵達終點！
                        </h1>
                        <p className="text-slate-400 text-xs md:text-sm font-mono">MISSION REPORT: SUCCESS</p>
                    </div>
                    
                    <div className="bg-slate-900/90 p-6 rounded-2xl border border-sky-500/20 mt-4 w-full max-w-sm shadow-lg relative overflow-hidden">
                        <div className="text-slate-500 text-xs md:text-sm uppercase tracking-widest mb-1 font-mono">本次冒險獲得積分</div>
                        <div className="text-5xl md:text-6xl font-black text-amber-400 font-mono">{score}</div>
                        <div className="text-slate-500 text-xs mt-3">滿分 240 分</div>
                        <div className="text-[10px] text-sky-400/80 font-mono mt-1 bg-sky-950/30 py-1 px-3 rounded-full inline-block">
                            登記者：{studentClass} 班 {studentSeat} 號
                        </div>
                    </div>

                    {/* Firestore 即時排行榜 */}
                    <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 w-full max-w-md">
                        <h3 className="font-bold text-white flex items-center gap-2 mb-3 border-b border-slate-800 pb-2 text-sm md:text-base">
                            <Icon name="badge" className="w-4 h-4 text-amber-400" />
                            【即時排行榜】🧊 冰河冒險
                        </h3>
                        
                        {loadingLeaderboard ? (
                            <div className="text-slate-400 text-sm py-8 font-mono animate-pulse">正在調取現場數據...</div>
                        ) : leaderboard.length > 0 ? (
                            <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                                {leaderboard.map((item, idx) => (
                                    <div key={idx} className={`flex justify-between items-center p-2 rounded text-xs md:text-sm font-mono ${item.class === studentClass && item.seat === studentSeat ? 'bg-sky-950/40 border border-sky-500/30' : 'bg-slate-950/50'}`}>
                                        <div className="flex items-center gap-3">
                                            <span className={`w-5 h-5 flex items-center justify-center rounded-full text-[10px] font-bold ${idx === 0 ? 'bg-amber-400 text-slate-950' : idx === 1 ? 'bg-slate-350 text-slate-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                                {idx + 1}
                                            </span>
                                            <span className="text-slate-200">{item.class} 班 {item.seat} 號</span>
                                        </div>
                                        <span className="text-amber-400 font-bold">{item.score} 分</span>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-slate-500 text-xs py-8">尚無調查數據，你是第一位挑戰者！</div>
                        )}
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onClick={startGame} className="w-full py-3 bg-sky-600 hover:bg-sky-500 text-slate-950 text-base md:text-lg font-extrabold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg">
                            <Icon name="refresh" className="w-4 h-4" />
                            重新挑戰
                        </button>
                        <a href="../index.html" className="w-full py-3 bg-slate-900 hover:bg-slate-800 text-sky-400 text-base md:text-lg font-bold rounded-xl transition-all border border-sky-800/40 flex items-center justify-center gap-2">
                            <Icon name="home" className="w-4 h-4" />
                            返回大廳
                        </a>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-950 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-900 flex items-center justify-center py-8 px-4">
                    <div className="w-full max-w-4xl">
                        {gameState === 'START' && renderStartScreen()}
                        {gameState === 'PLAYING' && renderPlayingScreen()}
                        {gameState === 'END' && renderEndScreen()}
                    </div>

                    {/* 班級座號登入浮窗 */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <form onSubmit={handleSaveLogin} className="bg-slate-900 border border-sky-500/30 p-6 md:p-8 rounded-3xl max-w-sm w-full space-y-6 shadow-2xl animate-pop-in">
                                <div className="text-center space-y-2">
                                    <div className="w-12 h-12 bg-sky-500/10 border border-sky-400/40 rounded-full flex items-center justify-center mx-auto text-sky-400">
                                        ❄️
                                    </div>
                                    <h3 className="text-xl font-bold text-white">請登記護衛隊身份</h3>
                                    <p className="text-slate-400 text-xs font-mono">登記後成績將自動上傳即時排行榜</p>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-mono text-sky-400 uppercase tracking-widest mb-1.5">班級 (Class)</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={studentClass} 
                                            onChange={(e) => setStudentClass(e.target.value)}
                                            placeholder="例如：305" 
                                            className="w-full bg-slate-950 border border-slate-700 focus:border-sky-500 rounded-xl px-4 py-3 text-white outline-none transition-colors text-sm font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-mono text-sky-400 uppercase tracking-widest mb-1.5">座號 (Seat No.)</label>
                                        <input 
                                            type="number" 
                                            required
                                            min="1"
                                            max="100"
                                            value={studentSeat} 
                                            onChange={(e) => setStudentSeat(e.target.value)}
                                            placeholder="例如：12" 
                                            className="w-full bg-slate-950 border border-slate-700 focus:border-sky-500 rounded-xl px-4 py-3 text-white outline-none transition-colors text-sm font-mono"
                                        />
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    className="w-full py-3 bg-gradient-to-r from-sky-500 to-blue-500 hover:from-sky-400 hover:to-blue-400 text-slate-950 font-black rounded-xl shadow-lg transition-all"
                                >
                                    完成登記，進入挑戰
                                </button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        // 產生動態雪花背景
        function createSnowflakes() {
            const container = document.getElementById('snow-container');
            if (!container) return;
            const count = 30;
            for(let i=0; i<count; i++) {
                const flake = document.createElement('div');
                flake.className = 'snow-particle';
                const size = Math.random() * 4 + 2;
                flake.style.width = size + 'px';
                flake.style.height = size + 'px';
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.animationDuration = (Math.random() * 8 + 6) + 's';
                flake.style.animationDelay = (Math.random() * -10) + 's';
                container.appendChild(flake);
            }
        }

        setTimeout(createSnowflakes, 200);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DecimalMathGame />);
    </script>
</body>
</html>
