<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三升四暑假國語閱讀理解與寫作互動工作坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F7F3E9; /* 暖調中性背景，減輕眼睛疲勞 */
            color: #2D3748;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sidebar-active {
            background-color: #E9B384;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .story-box {
            border: 2px dashed #A0AEC0;
            background-color: #FFFFFF;
            line-height: 1.8;
            transition: all 0.3s ease;
        }

        .story-box:hover {
            border-color: #E9B384;
            background-color: #FFFDF9;
        }

        .question-card {
            border-left: 4px solid #7FB4B4;
            background-color: #FFFFFF;
            transition: transform 0.2s ease;
        }

        .question-card:hover {
            transform: translateX(5px);
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            height: 280px;
            max-height: 350px;
        }

        /* 句子高亮樣式 */
        .story-sentence {
            cursor: pointer;
            transition: background-color 0.2s ease;
            border-radius: 3px;
            padding: 0 2px;
        }
        .story-sentence:hover {
            background-color: #FEF3C7; /* Hover 黃色 */
        }
        .story-sentence.highlighted {
            background-color: #FDE047; /* 點擊高亮黃色 */
        }

        /* 頁首與邊界設定 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 金牌動畫 */
        @keyframes medal-spin {
            0% { transform: scale(0) rotate(0deg); }
            80% { transform: scale(1.2) rotate(380deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        .medal-animate {
            animation: medal-spin 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<div class="flex h-screen overflow-hidden w-full">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 hidden md:flex flex-col">
        <div class="p-6">
            <h1 class="text-xl font-bold text-gray-800 flex items-center">
                <span class="mr-2 text-2xl">📖</span> 閱讀工坊
            </h1>
            <p class="text-xs text-gray-500 mt-1">PIRLS 閱讀與寫作工作坊</p>
        </div>
        <nav class="flex-1 overflow-y-auto px-4 space-y-1 no-scrollbar" id="sidebar-nav">
            <!-- Nav items injected by JS -->
        </nav>
        <div class="p-4 border-t border-gray-100 bg-gray-50">
            <div class="flex items-center space-x-3 mb-2">
                <div class="w-9 h-9 rounded-full bg-orange-100 border border-orange-200 flex items-center justify-center text-orange-600 font-bold overflow-hidden" id="student-avatar-container">
                    👶
                </div>
                <div class="text-sm">
                    <p class="font-bold text-gray-800" id="display-name">訪客學生</p>
                    <p class="text-xs text-gray-500">三年五班</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Bar -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10">
            <button class="md:hidden text-gray-600 text-xl" onclick="toggleMobileMenu()">☰</button>
            <div class="flex items-center space-x-4 sm:space-x-6">
                <span id="current-round-title" class="text-base sm:text-lg font-bold text-gray-700 truncate max-w-[120px] sm:max-w-none">歡迎來到工作坊</span>
                <span class="px-2.5 py-0.5 bg-teal-100 text-teal-700 text-xs rounded-full font-medium" id="round-status">探索中</span>
                <span class="text-xs text-gray-400 flex items-center space-x-1 animate-fade-in" id="cloud-sync-status">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-gray-300" id="cloud-sync-dot"></span>
                    <span id="cloud-sync-text">本地儲存</span>
                </span>
            </div>
            <div class="flex items-center space-x-2 text-sm text-gray-500">
                <span class="hidden sm:inline">工作坊進度:</span>
                <div class="w-20 sm:w-32 bg-gray-200 rounded-full h-2">
                    <div id="overall-progress" class="bg-teal-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <span class="font-bold text-xs" id="progress-percent">0%</span>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6" id="main-display">
            <!-- Content will be injected dynamically -->
        </div>
    </main>
</div>

<!-- Mobile Nav Drawer -->
<div id="mobile-menu" class="fixed inset-0 bg-black/50 z-50 hidden md:hidden" onclick="toggleMobileMenu()">
    <div class="w-64 h-full bg-white p-6 flex flex-col" onclick="event.stopPropagation()">
        <h2 class="text-xl font-bold mb-6 text-gray-800 border-b pb-4">📖 課程回次列表</h2>
        <nav class="space-y-1.5 flex-1 overflow-y-auto no-scrollbar" id="mobile-nav">
            <!-- Injected by JS -->
        </nav>
        <div class="p-4 border-t border-gray-100 bg-gray-50 rounded-xl mt-4">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-600 font-bold overflow-hidden" id="mobile-avatar-container">
                    👶
                </div>
                <div class="text-sm">
                    <p class="font-bold text-gray-800" id="mobile-display-name">訪客學生</p>
                    <p class="text-xs text-gray-500">三年五班</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Medal Modal (Congratulation Overlay) -->
<div id="medal-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border border-yellow-200 relative overflow-hidden">
        <!-- Confetti effects -->
        <div class="absolute inset-0 pointer-events-none opacity-40">
            <div class="absolute w-2 h-2 bg-red-400 rounded-full top-10 left-10 animate-ping"></div>
            <div class="absolute w-3 h-3 bg-yellow-400 rounded-full top-20 right-12 animate-ping"></div>
            <div class="absolute w-2 h-2 bg-blue-400 rounded-full bottom-16 left-20 animate-ping"></div>
        </div>
        
        <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6 border border-yellow-300">
            <span class="text-5xl medal-animate">🥇</span>
        </div>
        
        <h3 class="text-2xl font-bold text-gray-800 mb-2">太棒了！獲得章節勳章</h3>
        <p class="text-sm text-gray-500 mb-6" id="medal-congratulation-text">恭喜你完成了這個故事的所有挑戰！</p>
        
        <div class="p-3 bg-teal-50 rounded-xl mb-6 text-xs text-teal-800 font-medium">
            📈 你的 PIRLS 閱讀理解指標已獲得提升！
        </div>
        
        <button onclick="closeMedalModal()" class="w-full bg-orange-500 text-white font-bold py-3 rounded-full hover:bg-orange-600 shadow-lg transition transform hover:scale-105 active:scale-95">繼續挑戰</button>
    </div>
</div>

                { q: "2. 【歷程二：推解直接結論】王獻之把練了四年的字拿給母親看，為什麼他一開始感到「不服氣」，後來卻又「服氣」了呢？請根據故事內容說明他的心境轉變原因。", id: "r1q2", category: 1 },

    // --- Cloud Sync Helper Functions ---
    function updateSyncStatus(status, text) {
        const dot = document.getElementById('cloud-sync-dot');
        const txt = document.getElementById('cloud-sync-text');
        if (!dot || !txt) return;

        if (status === 'synced') {
            dot.className = "inline-block w-2.5 h-2.5 rounded-full bg-teal-500 animate-pulse";
            txt.innerText = text || "雲端已同步";
            txt.className = "text-teal-600 font-medium";
        } else if (status === 'syncing') {
            dot.className = "inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
            txt.innerText = text || "雲端同步中...";
            txt.className = "text-amber-600 font-medium";
        } else if (status === 'error') {
            dot.className = "inline-block w-2.5 h-2.5 rounded-full bg-red-500";
            txt.innerText = text || "同步失敗";
            txt.className = "text-red-500 font-medium";
        } else {
            dot.className = "inline-block w-2.5 h-2.5 rounded-full bg-gray-300";
            txt.innerText = text || "本地儲存";
            txt.className = "text-gray-400";
        }
    }

    function syncToFirebase() {
        if (!db || !appState.studentId) return;
        updateSyncStatus('syncing');
        
        const payload = {
            studentId: appState.studentId,
            name: appState.userName,
            seatNumber: appState.seatNumber,
            avatar: appState.userAvatar,
            completedRounds: appState.completedRounds,
            pirlsStats: appState.pirlsStats,
            answers: appState.answers,
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        };

        db.collection('summer_homework_2026').doc(appState.studentId).set(payload, { merge: true })
            .then(() => {
                updateSyncStatus('synced');
            })
            .catch(err => {
                console.error("Firestore sync error: ", err);
                updateSyncStatus('error', '雲端同步失敗');
            });
    }

    function debounceSyncToFirebase() {
        updateSyncStatus('syncing', '準備同步...');

        }
        syncTimeout = setTimeout(() => {

    function validateText(text, minLen) {
        const trimmed = (text || '').trim();
        if (trimmed.length === 0) {
            return { valid: false, msg: "❌ 欄位為空，請輸入您的答案。", code: 'empty' };
        }
        
        // 1. Chinese characters presence check
        const cleanCh = (trimmed.match(/[\u4e00-\u9fa5]/g) || []).join('');
        if (cleanCh.length < Math.min(2, Math.ceil(minLen / 3))) {
            return { valid: false, msg: "❌ 請使用中文完整回答問題喔！", code: 'no_chinese' };
        }
        
        // 2. Repetition & diversity check (on characters excluding punctuation/spaces)
        const cleanAll = trimmed.replace(/[\s\p{P}\p{S}]/gu, '');
        const uniqueChars = new Set(cleanAll);
        if (cleanAll.length >= 6) {
            const ratio = uniqueChars.size / cleanAll.length;
            if (ratio < 0.4) {
                return { valid: false, msg: "❌ 偵測到重複性字元或無意義輸入，請寫下您的具體想法喔！", code: 'gibberish' };
            }
        }
        
        // 3. Length check
        if (trimmed.length < minLen) {
            return { valid: false, msg: `⚠️ 字數不足，建議至少輸入 ${minLen} 個字以表達完整概念（目前 ${trimmed.length} 字）。`, code: 'too_short' };

    function checkExemplarCopy(text) {
        if (!text || text.length < 30) return false;
        
        const cleanInput = text.replace(/[^\u4e00-\u9fa5]/g, '');
        const cleanExemplar = exemplarText.replace(/[^\u4e00-\u9fa5]/g, '');
        
        const windowSize = 30;
        for (let i = 0; i <= cleanInput.length - windowSize; i++) {
            const sub = cleanInput.substring(i, i + windowSize);
            if (cleanExemplar.includes(sub)) {
                return true;
            }
        }
        
        if (cleanExemplar.includes(cleanInput) && cleanInput.length > 50) {
            return true;
        }
        
        return false;
    }

    function onQuestionInput(el, id, categoryIndex, minLen) {
        const val = el.value;
        appState.answers[id] = val;
        saveLocalStorage();
        
        const validation = validateText(val, minLen);
        const feedbackEl = document.getElementById(id + '-feedback');
        if (feedbackEl) {
            feedbackEl.innerText = validation.msg;
            feedbackEl.className = "text-[11px] mt-1 font-medium " + 
                (validation.code === 'ok' ? 'text-teal-600' : 'text-red-500');
        }
        
        updatePirlsChartStats();
    }

    function saveAndGrowAnswer(id, val, categoryIndex) {
        appState.answers[id] = val;
        saveLocalStorage();
        updatePirlsChartStats();
    }

    function updatePirlsChartStats() {
        const categoryLengths = [0, 0, 0, 0];
        
        rounds.forEach(r => {
            if (r.questions) {
                r.questions.forEach(q => {
                    let minLen = 4;
                    if (q.category === 1) minLen = 10;
                    if (q.category === 2) minLen = 15;
                    if (q.category === 3) minLen = 20;
                    
                    if (q.type === 'select-sequence') {
                        let seqCount = 0;
                        for (let stepIdx = 0; stepIdx < 4; stepIdx++) {
                            if (appState.answers[`${q.id}_step${stepIdx}`]) seqCount++;
                        }
                        if (seqCount === 4) {
                            categoryLengths[1] += 20;
                        }
                    } else {
                        const ans = appState.answers[q.id] || '';
                        const validation = validateText(ans, minLen);
                        if (validation.valid) {
                            categoryLengths[q.category] += ans.trim().length;
                        }
                    }
                });
            }
        });
        
        const writingText = appState.answers['round-9-writing'] || '';
        const writingValid = (writingText.trim().length >= 150 && !checkExemplarCopy(writingText));
        if (writingValid) {
            categoryLengths[2] += Math.min(200, writingText.trim().length / 2);
            categoryLengths[3] += Math.min(200, writingText.trim().length / 2);
        }
        
        for (let i = 0; i < 4; i++) {
            const extraPoints = Math.min(2.0, categoryLengths[i] / 40.0);
            appState.pirlsStats[i] = parseFloat((3.0 + extraPoints).toFixed(1));
        }
        
        saveLocalStorage();
        
        if (radarChart && appState.currentView === 'dashboard') {
            radarChart.data.datasets[0].data = appState.pirlsStats;
            radarChart.update('none');
        }
    }

    // --- Reward gold medal chime ---
    function playSuccessSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            
            // Success ascending chime
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                
                gain.gain.setValueAtTime(0, now + idx * 0.12);
                gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.12 + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.45);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(now + idx * 0.12);
                osc.stop(now + idx * 0.12 + 0.5);
            });
        } catch(e) {
            console.log("AudioContext blocked or not supported: ", e);
        }
    }

    function completeRound(rid) {
        const roundData = rounds.find(r => r.id === rid);
        const errors = [];
        
        if (roundData.questions) {
            roundData.questions.forEach((q, idx) => {
                if (q.type === 'select-sequence') {
                    let seqCount = 0;
                    const seqVals = [];
                    for (let stepIdx = 0; stepIdx < 4; stepIdx++) {
                        const val = appState.answers[`${q.id}_step${stepIdx}`];
                        if (val) {
                            seqCount++;
                            seqVals.push(val);
                        }
                    }
                    if (seqCount < 4) {
                        errors.push(`第 ${idx + 1} 題：步驟排序尚未選擇完畢。`);
                    } else {
                        const distinctVals = new Set(seqVals);
                        if (distinctVals.size < 4) {
                            errors.push(`第 ${idx + 1} 題：步驟排序選擇有重複，請確保 1 到 4 步各不相同。`);
                        }
                    }
                } else {
                    let minLen = 4;
                    if (q.category === 1) minLen = 10;
                    if (q.category === 2) minLen = 15;
                    if (q.category === 3) minLen = 20;
                    
                    const ans = appState.answers[q.id] || '';
                    const validation = validateText(ans, minLen);
                    if (!validation.valid) {
                        errors.push(`第 ${idx + 1} 題：${validation.msg.replace('❌ ', '').replace('⚠️ ', '')}`);
                    }
                }
            });
        } else if (roundData.type === 'writing') {
            const textVal = appState.answers['round-9-writing'] || '';
            const copyDetected = checkExemplarCopy(textVal);
            
            if (copyDetected) {
                errors.push("寫作內容：偵測到大量複製範文的句子，請寫出自己的暑假計畫喔！");
            } else if (textVal.trim().length < 150) {
                errors.push(`寫作內容：字數不足（目前 ${textVal.trim().length} 字，需要至少 150 字）。`);
            }
        }
        
        if (errors.length > 0) {
            alert("⚠️ 挑戰尚未完成，請修改以下項目後再提交：\n\n" + errors.map(e => "• " + e).join("\n"));
            return;
        }

        if (!appState.completedRounds.includes(rid)) {
            appState.completedRounds.push(rid);
            saveLocalStorage(true);
            syncToFirebase();
            
            // Show custom modal and play sound
            const textEl = document.getElementById('medal-congratulation-text');
            textEl.innerText = `恭喜你完成了「${roundTitles[rid-1]}」的所有理解與寫作挑戰！`;
            
            document.getElementById('medal-modal').classList.remove('hidden');
            playSuccessSound();
            
            renderSidebar();
            updateUI();
        } else {
            alert("此回次已完成，紀錄已更新。");
        }
    }

    function closeMedalModal() {
        document.getElementById('medal-modal').classList.add('hidden');
    }

    function initRadarChart() {
        const ctx = document.getElementById('radarChart');
        if (!ctx) return;
        
        if (radarChart) radarChart.destroy();
        
        radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['擷取特定資訊', '推解直接結論', '詮釋整合', '檢驗評估'],
                datasets: [{
                    label: '能力自評指標',
                    data: appState.pirlsStats,
                    fill: true,
                    backgroundColor: 'rgba(127, 180, 180, 0.35)',
                    borderColor: '#7FB4B4',
                    pointBackgroundColor: '#7FB4B4',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#7FB4B4',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { display: true, color: 'rgba(0,0,0,0.06)' },
                        grid: { color: 'rgba(0,0,0,0.06)' },
                        suggestedMin: 1.0,
                        suggestedMax: 5.0,
                        ticks: { stepSize: 1.0, display: false }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    function updateStudentSeat(seat) {
        appState.seatNumber = seat.trim();
        saveLocalStorage(true);
        renderSidebar();
        syncToFirebase();
    }

    function updateStudentName(name) {
        if (name.trim()) {
            appState.userName = name.trim();
            saveLocalStorage(true);
            renderSidebar();
            syncToFirebase();
        }
    }

    function updateStudentAvatar(avatar) {
        appState.userAvatar = avatar;
        saveLocalStorage(true);
        renderSidebar();
        syncToFirebase();
    }

    function startFirstRound() {
        switchView('round-1');
    }

    function resetProgress() {
        if (confirm("確定要清除所有學習紀錄嗎？這無法還原喔！")) {
            if (db && appState.studentId) {
                updateSyncStatus('syncing', '清除雲端資料...');
                db.collection('summer_homework_2026').doc(appState.studentId).delete()
                    .then(() => {
                        console.log("Cloud progress reset");
                        localStorage.removeItem('pirls_app_state_v2');
                        location.reload();
                    })
                    .catch(err => {
                        console.error(err);
                        localStorage.removeItem('pirls_app_state_v2');
                        location.reload();
                    });
            } else {
                localStorage.removeItem('pirls_app_state_v2');
                location.reload();
            }
        }
    }

    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    }
</script>
