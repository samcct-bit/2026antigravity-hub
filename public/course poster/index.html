<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>天祥大同新竹區一日基礎班課程簡章</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
            background-color: #f4eae0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .poster {
            width: 1000px;
            height: 1414px;
            background: url('poster_bg.png') no-repeat center center;
            background-size: cover;
            position: relative;
            padding: 90px 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .header {
            text-align: center;
            margin-top: 20px;
        }
        
        .header h2 {
            font-size: 38px;
            font-weight: 700;
            color: #2c1a04;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 58px;
            font-weight: 900;
            color: #8a1f11;
            letter-spacing: 6px;
            border-bottom: 3px double #8a1f11;
            display: inline-block;
            padding-bottom: 10px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.15);
        }
        
        .content-section {
            margin-top: -30px;
            background-color: rgba(255, 252, 246, 0.85);
            border: 2px solid #e2cfb6;
            border-radius: 12px;
            padding: 45px 50px;
            box-shadow: 0 4px 15px rgba(138, 31, 17, 0.05);
        }
        
        .item {
            margin-bottom: 25px;
            font-size: 26px;
            line-height: 1.6;
            color: #3e270c;
        }
        
        .item:last-child {
            margin-bottom: 0;
        }
        
        .item-title {
            font-weight: 700;
            color: #8a1f11;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .item-title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: #8a1f11;
            margin-right: 12px;
            border-radius: 2px;
        }
        
        .item-body {
            padding-left: 20px;
        }
        
        .sub-list {
            margin-top: 8px;
            list-style-type: none;
            padding-left: 10px;
        }
        
        .sub-list li {
            margin-bottom: 6px;
            position: relative;
            padding-left: 20px;
        }
        
        .sub-list li::before {
            content: "•";
            color: #8a1f11;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        
        .footer {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .quote {
            font-size: 28px;
            font-weight: 700;
            color: #2c1a04;
            line-height: 1.8;
            margin-bottom: 15px;
            letter-spacing: 3px;
            border-left: 3px solid #8a1f11;
            border-right: 3px solid #8a1f11;
            padding: 0 20px;
            display: inline-block;
        }
        
        .lotus-container {
            width: 280px;
            height: 190px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .lotus-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1));
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="header">
            <h2>天祥大同新竹區</h2>
            <h1>一日基礎班課程簡章</h1>
        </div>
        
        <div class="content-section">
            <div class="item">
                <div class="item-title">一、課程日期</div>
                <div class="item-body">2026年6月28日 (星期日)</div>
            </div>
            
            <div class="item">
                <div class="item-title">二、報到時間</div>
                <div class="item-body">早上 8:30 報到 (活動於竹北清泰佛堂準時開始)</div>
            </div>
            
            <div class="item">
                <div class="item-title">三、課程內容</div>
                <div class="item-body">
                    <ul class="sub-list">
                        <li><strong>上午專題課程</strong>：由林楹翔講師與林冠妘講師主講啟發性課程</li>
                        <li><strong>下午課程</strong>：餅乾手作課程</li>
                    </ul>
                </div>
            </div>
            
            <div class="item">
                <div class="item-title">四、報名方式</div>
                <div class="item-body">請即日起向各區區長完成報名程序；區長統計人數後，請回報給道務組長（蔡講師）。</div>
            </div>
        </div>
        
        <div class="footer">
            <div class="quote">
                修道最高的境界～無我<br>
                處事最好的方法～無爭
            </div>
            <div class="lotus-container">
                <img src="lotus_transparent.png" class="lotus-img" alt="去背蓮花">
            </div>
        </div>
    </div>
</body>
</html>
