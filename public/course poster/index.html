<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>一日基礎班課程簡章</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
            background-color: #120909;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .poster {
            width: 1000px;
            height: 1415px;
            background: url('S__23208083_patched.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        
        /* 1. Top Title Overlay (replaces "研究班") */
        .title-container {
            position: absolute;
            top: 75px;
            left: 95px;
            text-align: left;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .org-name {
            font-size: 26px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 6px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }
        
        .main-title {
            font-size: 92px;
            font-weight: 900;
            color: #f2e661;
            letter-spacing: 8px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9), -1px -1px 2px rgba(0, 0, 0, 0.5);
        }
        
        /* 2. Middle Course Info Overlay (replaces yellow quotes) */
        .course-info-container {
            position: absolute;
            top: 440px;
            left: 80px;
            width: 840px;
            height: 245px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .item-title {
            font-size: 22px;
            font-weight: 700;
            color: #f2e661;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }
        
        .item-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: #f2e661;
            margin-right: 8px;
            border-radius: 2px;
            box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .item-body {
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
            padding-left: 12px;
            line-height: 1.35;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }
        
        .sub-list {
            list-style-type: none;
            padding-left: 0;
        }
        
        .sub-list li {
            margin-bottom: 2px;
            position: relative;
            padding-left: 16px;
        }
        
        .sub-list li::before {
            content: "•";
            color: #f2e661;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="poster">
        <!-- New Title elements overlayed on top -->
        <div class="title-container">
            <div class="org-name">天祥大同新竹區</div>
            <div class="main-title">一日基礎班</div>
        </div>
        
        <!-- Course details overlayed in the middle -->
        <div class="course-info-container">
            <div class="item">
                <div class="item-title">一、課程日期</div>
                <div class="item-body">2026年7月26日 (星期日)</div>
            </div>
            
            <div class="item">
                <div class="item-title">二、報到時間</div>
                <div class="item-body">早上 8:30 報到 (活動於竹北清泰佛堂準時開始)</div>
            </div>
            
            <div class="item">
                <div class="item-title">三、課程內容</div>
                <div class="item-body">
                    <ul class="sub-list">
                        <li><strong>上午專題課程</strong>：由張宏茂壇主與蔡金成講師主講啟發性課程</li>
                        <li><strong>下午課程</strong>：手語表演課程</li>
                    </ul>
                </div>
            </div>
            
            <div class="item">
                <div class="item-title">四、報名方式</div>
                <div class="item-body">請即日起向各區區長完成報名程序；區長統計人數後，請回報給道務組長（蔡講師）。</div>
            </div>
        </div>
    </div>
</body>
</html>
