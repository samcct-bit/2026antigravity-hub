<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>一日基礎班課程簡章</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
            background-color: #0b0505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .poster {
            width: 1000px;
            height: 1415px;
            background: url('zen_poster_bg_no_vase.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        
        /* 1. Top Title */
        .title-container {
            position: absolute;
            top: 75px;
            left: 95px;
            text-align: left;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .org-name {
            font-size: 22px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 5px;
            margin-bottom: 6px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }
        
        .main-title {
            font-size: 76px;
            font-weight: 900;
            color: #f2e661;
            letter-spacing: 6px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9), -1px -1px 2px rgba(0, 0, 0, 0.5);
        }
        
        /* 2. Wisdom Text */
        .wisdom-container {
            position: absolute;
            top: 245px;
            left: 95px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }
        
        .wisdom-line {
            font-size: 34px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 4px;
            margin-bottom: 6px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }
        
        /* 3. Middle Course Info (Shifted to the left & Enlarged because vase is shrunk by half) */
        .course-info-container {
            position: absolute;
            top: 380px;
            left: 230px;
            width: 680px;
            height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }
        
        .item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .item-title {
            font-size: 30px;
            font-weight: 700;
            color: #f2e661;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }
        
        .item-title::before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 20px;
            background-color: #f2e661;
            margin-right: 10px;
            border-radius: 2px;
            box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .item-body {
            font-size: 26px;
            font-weight: 500;
            color: #ffffff;
            padding-left: 15px;
            line-height: 1.4;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }
        
        /* Specific enlargement for date */
        .date-body {
            font-size: 34px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }
        
        .sub-list {
            list-style-type: none;
            padding-left: 0;
        }
        
        .sub-list li {
            margin-bottom: 4px;
            position: relative;
            padding-left: 18px;
        }
        
        .sub-list li::before {
            content: "•";
            color: #f2e661;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        
        /* 4. Shrunk Vase Image overlay (placed on bottom-left, shrunk to 210px width) */
        .vase-overlay {
            position: absolute;
            bottom: 0px;
            left: 0px;
            width: 210px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5));
        }
        
        /* 5. Jigong Grand Master Teachings (Bottom-Right, overlayed in HTML) */
        .teachings-container {
            position: absolute;
            bottom: 180px;
            right: 95px;
            width: 440px;
            text-align: left;
            display: flex;
            flex-direction: column;
            z-index: 5;
        }
        
        .teachings-title {
            font-size: 24px;
            font-weight: 700;
            color: #f2e661;
            margin-bottom: 12px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
        }
        
        .teachings-body {
            font-size: 21px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="poster">
        <!-- New Title elements overlayed on top -->
        <div class="title-container">
            <div class="org-name">天祥大同新竹區</div>
            <div class="main-title">一日基礎班</div>
        </div>
        
        <!-- Shrunk Wisdom Text -->
        <div class="wisdom-container">
            <div class="wisdom-line">智慧開啟 祖先沾光</div>
            <div class="wisdom-line">心靈淨化 生命進化</div>
        </div>
        
        <!-- Course details overlayed in the middle -->
        <div class="course-info-container">
            <div class="item">
                <div class="item-title">一、課程日期</div>
                <div class="item-body date-body">2026年7月26日 (星期日)</div>
            </div>
            
            <div class="item">
                <div class="item-title">二、報到時間</div>
                <div class="item-body">早上 8:30 報到 (活動於竹北清泰佛堂準時開始)</div>
            </div>
            
            <div class="item">
                <div class="item-title">三、課程內容</div>
                <div class="item-body">
                    <ul class="sub-list">
                        <li><strong>上午專題課程</strong>：由張宏茂壇主與蔡金成講師主講啟發性課程</li>
                        <li><strong>下午課程</strong>：手語表演課程</li>
                    </ul>
                </div>
            </div>
            
            <div class="item">
                <div class="item-title">四、報名方式</div>
                <div class="item-body">請即日起向各區區長完成報名程序；區長統計人數後，請回報給道務組長（蔡講師）。</div>
            </div>
        </div>
        
        <!-- Shrunk Vase image overlayed at the bottom-left -->
        <img src="vase_cutout_new.png" class="vase-overlay" alt="精緻去背花瓶">
        
        <!-- Teachings overlayed on the bottom-right -->
        <div class="teachings-container">
            <div class="teachings-title">《濟公活佛 慈訓》</div>
            <div class="teachings-body">
                來佛堂有潛移默化的作用<br>
                因為佛光普照是無形的<br>
                佛光有萬道光芒<br>
                可以累積功德<br>
                可以迴向給冤親債主<br>
                讓你們的生命更加順利與圓滿<br>
                更讓你們有資糧往聖賢路前進
            </div>
        </div>
    </div>
</body>
</html>
